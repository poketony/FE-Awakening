name: Fix Awakening spacing batch

on:
  push:
    paths:
      - ".github/workflows/fix-awakening-spacing-batch.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install width-check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --quiet pillow

      - name: Fix and validate Awakening spacing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess
          from PIL import ImageFont

          roots = [
              Path("Awakening/Messages (K)"),
              Path("Awakening/DLC Message (K)"),
          ]

          replacements = [
              ("습격 당", "습격당"),
              ("무시 당", "무시당"),
              ("사랑 받", "사랑받"),
              ("인정 받", "인정받"),
              ("선택 받", "선택받"),
              ("도움 받", "도움받"),
              ("오해 받", "오해받"),
              ("보호 받", "보호받"),
              ("치료 받", "치료받"),
              ("신뢰 받", "신뢰받"),
              ("칭찬 받", "칭찬받"),
              ("저주 받", "저주받"),
              ("감동 받", "감동받"),
              ("위협 받", "위협받"),
              ("벌 받", "벌받"),
          ]

          expected = Counter({
              "습격 당": 2,
              "무시 당": 1,
              "사랑 받": 1,
              "인정 받": 2,
              "선택 받": 13,
              "도움 받": 2,
              "오해 받": 2,
              "보호 받": 2,
              "치료 받": 13,
              "신뢰 받": 2,
              "칭찬 받": 11,
              "저주 받": 13,
              "감동 받": 1,
              "위협 받": 1,
              "벌 받": 1,
          })

          dead_markers = ("_PCM2", "_PCM3", "_PCF2", "_PCF3")
          control_re = re.compile(r"\$[A-Za-z][A-Za-z0-9]*")

          before = {}
          changed_files = []
          changed_records = []
          counts = Counter()
          dead_hits = Counter()

          for root in roots:
              for path in sorted(root.rglob("*.txt")):
                  raw = path.read_bytes()
                  text = raw.decode("utf-8", errors="strict")
                  before[path] = text
                  lines = text.splitlines(keepends=True)
                  out = []
                  changed = False

                  for lineno, line in enumerate(lines, 1):
                      if not line.startswith("MID_"):
                          out.append(line)
                          continue

                      mid = line.split(":", 1)[0]
                      is_dead = any(marker in mid for marker in dead_markers)
                      new_line = line

                      for old, new in replacements:
                          n = new_line.count(old)
                          if not n:
                              continue
                          if is_dead:
                              dead_hits[old] += n
                              continue
                          counts[old] += n
                          changed_records.append((path, lineno, mid, old, new))
                          new_line = new_line.replace(old, new)

                      if new_line != line:
                          changed = True
                      out.append(new_line)

                  if changed:
                      new_text = "".join(out)
                      path.write_bytes(new_text.encode("utf-8"))
                      changed_files.append(path)

          if counts != expected:
              raise SystemExit(f"Unexpected replacement counts. expected={dict(expected)} actual={dict(counts)}")

          if sum(counts.values()) != 67:
              raise SystemExit(f"Unexpected total replacement count: {sum(counts.values())}")

          # Integrity checks for every changed file.
          for path in changed_files:
              old = before[path]
              raw = path.read_bytes()
              new = raw.decode("utf-8", errors="strict")

              if "\ufffd" in new:
                  raise SystemExit(f"U+FFFD found: {path}")
              bad_c0 = [ord(ch) for ch in new if ord(ch) < 32 and ch not in "\n\r\t"]
              if bad_c0:
                  raise SystemExit(f"Bad C0 control in {path}: {bad_c0[:10]}")

              old_mids = [ln.split(":", 1)[0] for ln in old.splitlines() if ln.startswith("MID_")]
              new_mids = [ln.split(":", 1)[0] for ln in new.splitlines() if ln.startswith("MID_")]
              if old_mids != new_mids:
                  raise SystemExit(f"MID order/count changed: {path}")

              if control_re.findall(old) != control_re.findall(new):
                  raise SystemExit(f"Control-code sequence changed: {path}")

              if old.count("\\n") != new.count("\\n"):
                  raise SystemExit(f"Literal \\n count changed: {path}")

              # Make sure the only textual edits are approved live-branch replacements.
              expected_lines = []
              for old_line in old.splitlines(keepends=True):
                  expected_line = old_line
                  if old_line.startswith("MID_"):
                      mid = old_line.split(":", 1)[0]
                      if not any(marker in mid for marker in dead_markers):
                          for a, b in replacements:
                              expected_line = expected_line.replace(a, b)
                  expected_lines.append(expected_line)
              expected_new = "".join(expected_lines)
              if expected_new != new:
                  raise SystemExit(f"Unexpected textual diff in {path}")

          # Proxy width check on every visual line touched by a replacement.
          font_path = "/usr/share/fonts/truetype/nanum/NanumGothic.ttf"
          font = ImageFont.truetype(font_path, 14)
          thresholds = {"t0": 278.8125, "t1": 298.734375}

          def strip_codes(s):
              s = re.sub(r"\$S(?:bp|sp|vp)[^|]*\|(?:\d+\|)?", "", s)
              s = re.sub(r"\$W[ms][^|]*\|\d*", "", s)
              s = re.sub(r"\$E[^|]*\|", "", s)
              s = re.sub(r"\$[A-Za-z][A-Za-z0-9]*\|?", "", s)
              return s

          width_failures = []
          checked_segments = 0
          changed_by_path_line = {(str(p), ln) for p, ln, *_ in changed_records}

          for path in changed_files:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if (str(path), lineno) not in changed_by_path_line:
                      continue
                  style = "t0" if "$t0" in line else ("t1" if "$t1" in line else None)
                  if style is None:
                      continue
                  threshold = thresholds[style]
                  payload = line.split(":", 1)[1] if line.startswith("MID_") and ":" in line else line
                  parts = re.split(r"\\n|\$k|\$p", payload)
                  for part in parts:
                      if not any(new in part for _, new in replacements):
                          continue
                      visible = strip_codes(part).strip()
                      if not visible:
                          continue
                      width = font.getlength(visible)
                      checked_segments += 1
                      if width > threshold:
                          width_failures.append((str(path), lineno, style, width, threshold, visible))

          if width_failures:
              for item in width_failures[:20]:
                  print("WIDTH_FAIL", item)
              raise SystemExit(f"Width check failed for {len(width_failures)} segment(s)")

          # Confirm dead branches were never edited.
          for path in changed_files:
              old_lines = before[path].splitlines()
              new_lines = path.read_text(encoding="utf-8").splitlines()
              if len(old_lines) != len(new_lines):
                  raise SystemExit(f"Physical line count changed: {path}")
              for old_line, new_line in zip(old_lines, new_lines):
                  if old_line.startswith("MID_"):
                      mid = old_line.split(":", 1)[0]
                      if any(marker in mid for marker in dead_markers) and old_line != new_line:
                          raise SystemExit(f"Dead Avatar branch changed: {path} {mid}")

          subprocess.run(["git", "diff", "--check"], check=True)

          print(f"Changed files: {len(changed_files)}")
          print(f"Changed live occurrences: {sum(counts.values())}")
          print(f"Width-checked segments: {checked_segments}")
          print("Counts:")
          for old, _ in replacements:
              print(f"  {old} -> {counts[old]}")
          print("Ignored dead-branch hits:")
          for k, v in sorted(dead_hits.items()):
              print(f"  {k}: {v}")
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-awakening-spacing-batch.yml
          git add "Awakening/Messages (K)" "Awakening/DLC Message (K)"
          git diff --cached --check
          git commit -m "Fix Awakening Korean passive spacing"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)"
