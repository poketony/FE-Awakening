name: Restore two Awakening MID controls
on:
  push:
    paths: ['.github/workflows/restore-two-mids.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact MID control structures and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=[(Path('Awakening/Messages (K)/011.txt'),'011.txt','MID_012_OP2_プレイヤー女_02_PCF1'),(Path('Awakening/Messages (K)/P002.txt'),'P002.txt','MID_P002_ED1_PCF1')]
          old={p:p.read_text('utf-8') for p,_,_ in targets}
          midpat=re.compile(r'^MID_[^:]+:',re.M)
          def replace_in_mid(text,name,a,b):
            m=re.search(r'(^'+re.escape(name)+r': )(.*?)(?=^MID_|\Z)',text,re.M|re.S); assert m
            body=m.group(2); assert body.count(a)==1,(name,body.count(a))
            nb=body.replace(a,b,1)
            return text[:m.start(2)]+nb+text[m.end(2):]
          p,_,name=targets[0]
          s=replace_in_mid(old[p],name,'$Wsリズ|$Wd$w0|$Wmクロム|6$w0|$SvpSE_VOICE_CHROM_EVT_11|$p정말이지… $Nu,','$Wsリズ|$Wd$w0|$Wmクロム|6$w0|$Wsクロム|$Wa$SvpSE_VOICE_CHROM_EVT_11|$p정말이지… $Nu,')
          p.write_text(s,encoding='utf-8',newline='')
          p,_,name=targets[1]
          s=replace_in_mid(old[p],name,'$k$p$b向き,リズ,B|$E通常,|그런데 말이야……\\n$Nu씨는 굉장하다!','$k$p$E通常,|그런데 말이야……\\n$Nu씨는 굉장하다!')
          p.write_text(s,encoding='utf-8',newline='')
          # Integrity + modified-line width safety: dialogue payload and explicit line breaks are unchanged.
          for p,_,_ in targets:
            ns=p.read_text('utf-8')
            assert '\ufffd' not in ns
            assert not any(ord(c)<32 and c not in '\n\r\t' for c in ns)
            assert midpat.findall(old[p])==midpat.findall(ns)
            assert old[p].count('\n')==ns.count('\n')
          # Exact intended whole-file deltas only.
          expect011=old[targets[0][0]].replace('$Wsリズ|$Wd$w0|$Wmクロム|6$w0|$SvpSE_VOICE_CHROM_EVT_11|$p정말이지… $Nu,','$Wsリズ|$Wd$w0|$Wmクロム|6$w0|$Wsクロム|$Wa$SvpSE_VOICE_CHROM_EVT_11|$p정말이지… $Nu,',1)
          assert targets[0][0].read_text('utf-8')==expect011
          # P002 has same sequence elsewhere, so construct expected change MID-locally.
          expectP=replace_in_mid(old[targets[1][0]],targets[1][2],'$k$p$b向き,リズ,B|$E通常,|그런데 말이야……\\n$Nu씨는 굉장하다!','$k$p$E通常,|그런데 말이야……\\n$Nu씨는 굉장하다!')
          assert targets[1][0].read_text('utf-8')==expectP
          def body(text,name):
            m=re.search(r'^'+re.escape(name)+r': (.*?)(?=^MID_|\Z)',text,re.M|re.S); assert m; return m.group(1)
          for kp,fn,name in targets:
            jb=body((Path('Awakening/Messages (J)')/fn).read_text('utf-8'),name)
            kb=body(kp.read_text('utf-8'),name)
            for code in ['$Ws','$Wa','$b']:
              assert jb.count(code)==kb.count(code),(fn,name,code,jb.count(code),kb.count(code))
          print('PASS: Korean dialogue and explicit line breaks unchanged; rendered line widths therefore unchanged.')
          print('PASS: UTF-8/C0/MID structure and JP high-risk control counts validated.')
          PY
      - name: Commit repair and remove temporary files
        run: |
          rm -f .github/TWO_MIDS.txt .github/workflows/extract-two-mids.yml .github/workflows/restore-two-mids.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Restore original control structure in two Awakening MIDs'
          git push
