name: Extract two Awakening MIDs
on:
  push:
    paths: ['.github/workflows/extract-two-mids.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=[('011.txt','MID_012_OP2_プレイヤー女_02_PCF1'),('P002.txt','MID_P002_ED1_PCF1')]
          out=[]
          for fn,mid in targets:
            for lang in ['K','J']:
              p=Path(f'Awakening/Messages ({lang})')/fn
              s=p.read_text(encoding='utf-8')
              m=re.search(r'^'+re.escape(mid)+r': (.*?)(?=^MID_|\Z)',s,re.M|re.S)
              out += [f'=== {lang} {fn} {mid} ===',m.group(1).rstrip('\r\n'),'']
          Path('.github/TWO_MIDS.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/TWO_MIDS.txt
          git commit -m 'Temporary extract two Awakening MIDs'
          git push
