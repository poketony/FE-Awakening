name: Normalize Awakening text

on:
  push:
    paths:
      - '.github/workflows/normalize-awakening-text.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install font dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum python3-pil
      - name: Normalize text and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys, subprocess
          from PIL import ImageFont

          ROOTS = [
              (Path('Awakening/Messages (K)'), Path('Awakening/Messages (J)')),
              (Path('Awakening/DLC Message (K)'), Path('Awakening/DLC Message (J)')),
          ]
          BAD_QUOTES = set('“”＂')
          ALL_QUOTES = set('「」『』“”＂"')
          expr_repls = {
              '젠자앙': '젠장~',
              '씨~이!': '씨~!',
              '니~임!': '님~!',
          }

          font_paths = [
              '/usr/share/fonts/truetype/nanum/NanumGothic.ttf',
              '/usr/share/fonts/truetype/nanum/NanumGothicCoding.ttf',
          ]
          fp = next((p for p in font_paths if Path(p).exists()), None)
          if not fp:
              raise SystemExit('NanumGothic font not found')
          font = ImageFont.truetype(fp, 14)
          def width(s): return font.getlength(s)
          t1_ref = width('것이다. 내 패도와 네 녀석들의 길은 결코 만나지 않')
          t0_ref = t1_ref * (278.8125 / 298.734375)

          mid_re = re.compile(r'^(MID_[^:]+): (.*)$', re.M)
          ctrl_re = re.compile(r'\$[A-Za-z][A-Za-z0-9_]*(?:[^|$\\\r\n]*\|)?')

          def quote_target(c):
              if c in '「」『』': return c
              return '"'

          def map_quotes(kbody, jbody):
              kt = [c for c in kbody if c in ALL_QUOTES]
              jt = [c for c in jbody if c in ALL_QUOTES]
              if not any(c in BAD_QUOTES for c in kt):
                  return kbody, None
              if len(kt) != len(jt):
                  return kbody, f'quote-count mismatch K={len(kt)} J={len(jt)}'
              targets = iter([quote_target(c) for c in jt])
              out = []
              for c in kbody:
                  if c in ALL_QUOTES:
                      out.append(next(targets))
                  else:
                      out.append(c)
              return ''.join(out), None

          def indent_quotes(body):
              out=[]; stack=[]; i=0
              while i < len(body):
                  c=body[i]
                  if c == '「': stack.append('」')
                  elif c == '『': stack.append('』')
                  elif c in '」』':
                      if stack and stack[-1] == c: stack.pop()
                  elif c == '"':
                      if stack and stack[-1] == '"': stack.pop()
                      else: stack.append('"')
                  if c == '\\' and i+1 < len(body) and body[i+1]=='n':
                      out.extend(['\\','n']); i += 2
                      if stack:
                          if i < len(body) and body[i] == '$':
                              # Don't risk inserting whitespace before a control code.
                              continue
                          if stack[-1] in ('」','』'):
                              if not body.startswith('　', i): out.append('　')
                          elif stack[-1] == '"':
                              while i < len(body) and body[i] == '　': i += 1
                      continue
                  out.append(c); i += 1
              return ''.join(out)

          def visible_segments(body):
              style='t1'
              m=re.search(r'\$t([01])', body)
              if m: style='t'+m.group(1)
              s=body.replace('$p','\\n').replace('$k','\\n')
              # Commands with arguments ending in |, then bare commands.
              s=re.sub(r'\$[A-Za-z][A-Za-z0-9_]*[^|$\\]*\|','',s)
              s=re.sub(r'\$[A-Za-z][A-Za-z0-9_]*','',s)
              return style, [x for x in s.split('\\n') if x]

          changed_files=[]; ambiguous=[]; width_errors=[]; stats={'expr':0,'quote':0,'indent':0}

          for kroot,jroot in ROOTS:
              for kp in sorted(kroot.glob('*.txt')):
                  before_b = kp.read_bytes()
                  try: before = before_b.decode('utf-8')
                  except UnicodeDecodeError as e: raise SystemExit(f'Invalid UTF-8 before edit: {kp}: {e}')
                  jp = jroot / kp.name
                  jtext = jp.read_text(encoding='utf-8') if jp.exists() else None
                  jmap = {m.group(1):m.group(2) for m in mid_re.finditer(jtext)} if jtext else {}
                  old_mids = [(m.group(1),m.group(2)) for m in mid_re.finditer(before)]
                  out=[]; pos=0; changed_mid_names=set()
                  for m in mid_re.finditer(before):
                      out.append(before[pos:m.start()]); name, body=m.group(1),m.group(2)
                      nb=body
                      for a,b in expr_repls.items():
                          n=nb.count(a)
                          if n: stats['expr'] += n; nb=nb.replace(a,b)
                      if name in jmap and any(c in BAD_QUOTES for c in nb):
                          qb,err=map_quotes(nb,jmap[name])
                          if err:
                              ambiguous.append(f'{kp}:{name}: {err}')
                          else:
                              if qb != nb: stats['quote'] += 1
                              nb=qb
                      ib=indent_quotes(nb)
                      if ib != nb: stats['indent'] += 1
                      nb=ib
                      if nb != body: changed_mid_names.add(name)
                      out.append(f'{name}: {nb}')
                      pos=m.end()
                  out.append(before[pos:])
                  after=''.join(out)
                  if after == before: continue

                  # Integrity checks.
                  if '\ufffd' in after: raise SystemExit(f'U+FFFD introduced/found: {kp}')
                  bad_c0=[ch for ch in after if ord(ch)<32 and ch not in '\n\r\t']
                  if bad_c0: raise SystemExit(f'Invalid C0 control found: {kp}')
                  new_mids=[(m.group(1),m.group(2)) for m in mid_re.finditer(after)]
                  if [x[0] for x in old_mids] != [x[0] for x in new_mids]:
                      raise SystemExit(f'MID order/count changed: {kp}')
                  if ctrl_re.findall(before) != ctrl_re.findall(after):
                      raise SystemExit(f'Control-code sequence changed: {kp}')
                  if before.count('\n') != after.count('\n'):
                      raise SystemExit(f'Physical line count changed: {kp}')

                  # Width check only for modified MIDs, all visible rows in those MIDs.
                  newmap=dict(new_mids)
                  for name in changed_mid_names:
                      style,segs=visible_segments(newmap[name])
                      lim=t0_ref if style=='t0' else t1_ref
                      for seg in segs:
                          w=width(seg)
                          if w > lim + 0.01:
                              width_errors.append(f'{kp}:{name}:{style}:{w:.2f}>{lim:.2f}: {seg}')

                  kp.write_text(after, encoding='utf-8', newline='')
                  # Re-read strict UTF-8 to catch write corruption.
                  kp.read_bytes().decode('utf-8')
                  changed_files.append(str(kp))

          if width_errors:
              print('WIDTH ERRORS:')
              print('\n'.join(width_errors[:200]))
              raise SystemExit(f'{len(width_errors)} modified visible rows exceed their width limit')

          subprocess.run(['git','diff','--check'],check=True)
          print('changed files:', len(changed_files))
          print('stats:', stats)
          if ambiguous:
              print('AMBIGUOUS QUOTE MIDS SKIPPED:')
              print('\n'.join(ambiguous))
          Path('/tmp/changed.txt').write_text('\n'.join(changed_files),encoding='utf-8')
          PY
      - name: Commit normalization and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/normalize-awakening-text.yml
          git add Awakening '.github/workflows/normalize-awakening-text.yml'
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Normalize Awakening expressions and quotation marks'
          git push
