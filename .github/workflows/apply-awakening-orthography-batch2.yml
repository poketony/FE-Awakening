name: Apply Awakening orthography batch 2

on:
  push:
    paths:
      - ".github/workflows/apply-awakening-orthography-batch2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install width dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --quiet pillow

      - name: Apply confirmed live-branch fixes and validate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import defaultdict, Counter
          import re, subprocess
          from PIL import ImageFont

          rules=[
            ("Awakening/Messages (K)/フレデリク_ミリエル.txt","자신있으니까요","자신 있으니까요"),
            ("Awakening/Messages (K)/フレデリク_ミリエル.txt","크롬 님과 이야기 할 때에도","크롬 님과 이야기할 때에도"),
            ("Awakening/Messages (K)/シンシア_セレナ.txt","모든 종복에서","모든 종목에서"),
            ("Awakening/Messages (K)/シンシア_セレナ.txt","히어로 대사 보다","히어로 대사보다"),
            ("Awakening/Messages (K)/ヴェイク_セルジュ.txt","상처입은 곳","상처 입은 곳"),
            ("Awakening/Messages (K)/ウード_マーク女.txt","함께 할 것을 맹세한다","함께할 것을 맹세한다"),
            ("Awakening/Messages (K)/セルジュ_ロンクー.txt","게속","계속"),
            ("Awakening/Messages (K)/セルジュ_ロンクー.txt","교외로 놀러가자고","교외로 놀러 가자고"),
            ("Awakening/Messages (K)/プレイヤー男_リヒト.txt","그럴려나","그러려나"),
            ("Awakening/Messages (K)/ティアモ_ヘンリー.txt","10번 정도 왔다갔다하면","10번 정도 왔다 갔다 하면"),
            ("Awakening/Messages (K)/ティアモ_ヘンリー.txt","사람 마은은","사람 마음은"),
            ("Awakening/Messages (K)/ティアモ_ヘンリー.txt","크롬 님을 따라하려 하지 마","크롬 님을 따라 하려 하지 마"),
            ("Awakening/Messages (K)/セレナ_ブレディ.txt","생각 안해?","생각 안 해?"),
            ("Awakening/Messages (K)/セレナ_ブレディ.txt","나랑 있는 것 보다","나랑 있는 것보다"),
            ("Awakening/Messages (K)/マルス_ロラン.txt","부상을 치료한지","부상을 치료한 지"),
            ("Awakening/Messages (K)/マルス_ロラン.txt","벌것 아닙니다","별것 아닙니다"),
            ("Awakening/Messages (K)/ウード_ンン.txt","그런 데에서 뭐하는 거야","그런 데에서 뭐 하는 거야"),
            ("Awakening/Messages (K)/ウード_ンン.txt","어린애 취급 해 버려서","어린애 취급해 버려서"),
            ("Awakening/Messages (K)/ウード_ンン.txt","어린애 취급 받는 게","어린애 취급받는 게"),
            ("Awakening/Messages (K)/X002.txt","너가 쓰러트렸잖아","네가 쓰러트렸잖아"),
            ("Awakening/Messages (K)/シャンブレー_ンン.txt","지금 뭐하는 겁니까","지금 뭐 하는 겁니까"),
            ("Awakening/Messages (K)/シャンブレー_ンン.txt","이 이야기를 먼저 거낸 건","이 이야기를 먼저 꺼낸 건"),
            ("Awakening/Messages (K)/ウード_ノワール.txt","마음 먹었건만","마음먹었건만"),
            ("Awakening/Messages (K)/ウード_ノワール.txt","케이크의 일종이라는 것 밖에는","케이크의 일종이라는 것밖에는"),
            ("Awakening/Messages (K)/ウード_ノワール.txt","역시 아무때나","역시 아무 때나"),
            ("Awakening/Messages (K)/ウード_ノワール.txt","무리 하지 마","무리하지 마"),
            ("Awakening/Messages (K)/ウード_ノワール.txt","격식차리고 말하니까","격식 차리고 말하니까"),
            ("Awakening/Messages (K)/アズール_マルス.txt","이러면 안된다고","이러면 안 된다고"),
            ("Awakening/Messages (K)/アズール_マルス.txt","매도 당한 것도","매도당한 것도"),
            ("Awakening/Messages (K)/ベルベット_ロンクー.txt","변덕이었다고 말 했잖아","변덕이었다고 말했잖아"),
            ("Awakening/Messages (K)/グレゴ_リズ.txt","무섭다고 말 했었지","무섭다고 말했었지"),
            ("Awakening/Messages (K)/グレゴ_リズ.txt","굳게 마음 먹고","굳게 마음먹고"),
            ("Awakening/Messages (K)/グレゴ_リズ.txt","나쁜 듯은 없었어","나쁜 뜻은 없었어"),
            ("Awakening/Messages (K)/セルジュ_プレイヤー女.txt","뭐가 잘못 됐어?","뭐가 잘못됐어?"),
            ("Awakening/Messages (K)/シンシア_マルス.txt","하고 잘 할 수 있어?","하고 잘할 수 있어?"),
            ("Awakening/Messages (K)/紹介文.txt","상처입은 동물","상처 입은 동물"),
            ("Awakening/Messages (K)/紹介文.txt","수송대 마차 한 켠에서","수송대 마차 한편에서"),
            ("Awakening/Messages (K)/アズール_ジェローム.txt","너, 너! 뭐하는 거냐!?","너, 너! 뭐 하는 거냐!?"),
            ("Awakening/Messages (K)/アズール_ジェローム.txt","거부해도 소용 없거든","거부해도 소용없거든"),
            ("Awakening/Messages (K)/セルジュ_ドニ.txt","빨래랑 수리\n끝냈셨네요","빨래랑 수리\n끝내셨네요"),
            ("Awakening/Messages (K)/セルジュ_ドニ.txt","세르주씨를 따라했더니","세르주씨를 따라 했더니"),
            ("Awakening/Messages (K)/セルジュ_ドニ.txt","바느질도 잘 하게 됐죠","바느질도 잘하게 됐죠"),
            ("Awakening/Messages (K)/マルス_オリヴィエ_親子.txt","고맙습니다! 기대 되네요","고맙습니다! 기대되네요"),
            ("Awakening/Messages (K)/ノワール_ソール_親子.txt","저주 도구를 압수 당해서","저주 도구를 압수당해서"),
            ("Awakening/Messages (K)/シャンブレー_グレゴ_親子.txt","바람피지 말라고","바람피우지 말라고"),
            ("Awakening/DLC Message (K)/3. 영령의 마법 부적3.txt","참모… 저기 ,\n","참모… 저기,\n"),
            ("Awakening/DLC Message (K)/13. 빛 대 어둠 빛 편.txt","신기한 녀석이야. 그럼 ,\n","신기한 녀석이야. 그럼,\n"),
          ]

          dead=("_PCM2","_PCM3","_PCF2","_PCF3")
          by=defaultdict(list)
          for p,a,b in rules: by[p].append((a,b))

          before={}
          changed=[]
          rec=[]
          counts=Counter()

          for pstr,rs in by.items():
            p=Path(pstr)
            old=p.read_bytes().decode("utf-8","strict")
            before[p]=old
            out=[]
            anychg=False
            for no,line in enumerate(old.splitlines(keepends=True),1):
              nl=line
              if line.startswith("MID_"):
                mid=line.split(":",1)[0]
                if not any(x in mid for x in dead):
                  for a,b in rs:
                    n=nl.count(a)
                    if n:
                      counts[(pstr,a,b)]+=n
                      rec.append((p,no,mid,a,b,n))
                      nl=nl.replace(a,b)
              if nl!=line: anychg=True
              out.append(nl)
            if anychg:
              p.write_bytes("".join(out).encode("utf-8"))
              changed.append(p)

          missing=[r for r in rules if counts[r]==0]
          if missing:
            print("MISSING")
            for r in missing: print(r)
            raise SystemExit(f"{len(missing)} expected fixes not found")

          control_re=re.compile(r"\$[A-Za-z][A-Za-z0-9]*")
          for p in changed:
            old=before[p]
            new=p.read_bytes().decode("utf-8","strict")
            if "\ufffd" in new: raise SystemExit(f"U+FFFD {p}")
            if any(ord(ch)<32 and ch not in "\n\r\t" for ch in new):
              raise SystemExit(f"C0 {p}")

            om=[x.split(":",1)[0] for x in old.splitlines() if x.startswith("MID_")]
            nm=[x.split(":",1)[0] for x in new.splitlines() if x.startswith("MID_")]
            if om!=nm: raise SystemExit(f"MID order/count {p}")
            if control_re.findall(old)!=control_re.findall(new):
              raise SystemExit(f"control code sequence {p}")
            if old.count("\\n")!=new.count("\\n"):
              raise SystemExit(f"literal newline token count {p}")

            # Reconstruct intended file exactly.
            exp=[]
            for line in old.splitlines(keepends=True):
              e=line
              if line.startswith("MID_"):
                mid=line.split(":",1)[0]
                if not any(x in mid for x in dead):
                  for a,b in by[str(p)]: e=e.replace(a,b)
              exp.append(e)
            if "".join(exp)!=new: raise SystemExit(f"unexpected diff {p}")

            ol=old.splitlines(); nl=new.splitlines()
            if len(ol)!=len(nl): raise SystemExit(f"physical lines changed {p}")
            for a,b in zip(ol,nl):
              if a.startswith("MID_"):
                mid=a.split(":",1)[0]
                if any(x in mid for x in dead) and a!=b:
                  raise SystemExit(f"dead branch changed {p} {mid}")

          # Width check changed visual segments only.
          font=ImageFont.truetype("/usr/share/fonts/truetype/nanum/NanumGothic.ttf",14)
          lim={"t0":278.8125,"t1":298.734375}
          touched={(str(p),no) for p,no,*_ in rec}
          checked=0; fails=[]

          def strip(s):
            s=re.sub(r"\$S(?:bp|sp|vp|bs|bv)[^|]*\|(?:\d+\|)?","",s)
            s=re.sub(r"\$W[ms][^|]*\|\d*","",s)
            s=re.sub(r"\$E[^|]*\|","",s)
            s=re.sub(r"\$b[^|]*\|","",s)
            s=re.sub(r"\$[A-Za-z][A-Za-z0-9]*\|?","",s)
            return s

          for p in changed:
            oldlines=before[p].splitlines()
            newlines=p.read_text(encoding="utf-8").splitlines()
            for no,(o,n) in enumerate(zip(oldlines,newlines),1):
              if (str(p),no) not in touched: continue
              style="t0" if "$t0" in n else ("t1" if "$t1" in n else None)
              if not style: continue
              op=o.split(":",1)[1] if ":" in o else o
              np=n.split(":",1)[1] if ":" in n else n
              os=re.split(r"\\n|\$k|\$p",op)
              ns=re.split(r"\\n|\$k|\$p",np)
              if len(os)!=len(ns): raise SystemExit(f"visual structure changed {p}:{no}")
              for a,b in zip(os,ns):
                if a==b: continue
                vis=strip(b).strip()
                if not vis: continue
                w=font.getlength(vis); checked+=1
                if w>lim[style]: fails.append((str(p),no,style,w,lim[style],vis))
          if fails:
            for f in fails: print("WIDTH_FAIL",f)
            raise SystemExit(f"{len(fails)} width failures")

          subprocess.run(["git","diff","--check"],check=True)
          mids={(str(p),mid) for p,_,mid,*_ in rec}
          print(f"RULES={len(rules)}")
          print(f"FILES={len(changed)}")
          print(f"OCCURRENCES={sum(counts.values())}")
          print(f"MIDS={len(mids)}")
          print(f"WIDTH_SEGMENTS={checked}")
          print("=== APPLIED ===")
          for (p,a,b),c in sorted(counts.items()):
            print(f"{c}\t{p}\t{a} => {b}")
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-awakening-orthography-batch2.yml
          git add "Awakening/Messages (K)" "Awakening/DLC Message (K)"
          git diff --cached --check
          git commit -m "Fix Awakening Korean orthography batch 2"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)"
