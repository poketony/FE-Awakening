name: Apply Awakening Korean orthography fixes
on:
  push:
    paths: ['.github/workflows/audit-awakening-korean-orthography.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply high-confidence spelling and spacing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots=[Path('Awakening/Messages (K)'),Path('Awakening/DLC Message (K)')]
          mid_start=re.compile(r'^MID_[^:]+:',re.M)
          dead=re.compile(r'_(?:PCM[23]|PCF[23])(?:$|_)')
          ctrl=re.compile(r'\$[A-Za-z][A-Za-z0-9_]*(?:[^|$\\\r\n]*\|)?')

          # All of these are one- or two-token orthographic corrections; no sentence-level rewrites.
          simple=[
            (re.compile(r'익숙치'), '익숙지'),
            (re.compile(r'몇일'), '며칠'),
            (re.compile(r'웬지'), '왠지'),
            (re.compile(r'왠일'), '웬일'),
            (re.compile(r'어떻해|어떡게|어떻케'), '어떻게'),
            (re.compile(r'금새'), '금세'),
            (re.compile(r'오랫만'), '오랜만'),
            (re.compile(r'왠만'), '웬만'),
            (re.compile(r'어의없'), '어이없'),
            (re.compile(r'역활'), '역할'),
            (re.compile(r'갯수'), '개수'),
            (re.compile(r'댓가'), '대가'),
            (re.compile(r'뒷풀이'), '뒤풀이'),
            (re.compile(r'윗쪽'), '위쪽'),
            (re.compile(r'뒷쪽'), '뒤쪽'),
            (re.compile(r'짜집기'), '짜깁기'),
            (re.compile(r'통채로'), '통째로'),
            (re.compile(r'곰곰히'), '곰곰이'),
            (re.compile(r'깨끗히'), '깨끗이'),
            (re.compile(r'틈틈히'), '틈틈이'),
            (re.compile(r'일일히'), '일일이'),
            (re.compile(r'번번히'), '번번이'),
            (re.compile(r'가까히'), '가까이'),
            (re.compile(r'됬'), '됐'),
            (re.compile(r'할려고'), '하려고'),
            (re.compile(r'갈려고'), '가려고'),
            (re.compile(r'볼려고'), '보려고'),
            (re.compile(r'먹을려고'), '먹으려고'),
            (re.compile(r'할려면'), '하려면'),
            (re.compile(r'못지\s+않'), '못지않'),
            (re.compile(r'(?<![가-힣])할뿐(?![가-힣])'), '할 뿐'),
            (re.compile(r'어느정도'), '어느 정도'),
            (re.compile(r'정신차리'), '정신 차리'),
          ]

          # State/result + 있다: standard spacing in these dialogue contexts.
          state_stems=['들어','담겨','놓여','남아','살아','붙어','숨어','앉아','되어','돼']
          state_pats=[(re.compile(re.escape(s)+r'있'), s+' 있') for s in state_stems]
          # Prohibitive/impossibility uses confirmed by context in the audit.
          an되_forms=['안되니까','안되면','안되는','안되나요','안되니','안되겠','안되지','안되어','안된다','안됩니다']
          an되_map={x:x.replace('안되','안 되',1) for x in an되_forms}
          an돼_forms=['안돼요','안돼서','안돼도','안돼지','안돼는','안돼면','안돼겠','안돼죠']
          an돼_map={x:x.replace('안돼','안 돼',1) for x in an돼_forms}

          changed=[]
          for root in roots:
            for p in sorted(root.glob('*.txt')):
              before=p.read_text(encoding='utf-8')
              matches=list(mid_start.finditer(before))
              if not matches: continue
              chunks=[]; pos=0; file_changes=[]
              for i,m in enumerate(matches):
                start=m.start(); end=matches[i+1].start() if i+1<len(matches) else len(before)
                chunks.append(before[pos:start]); block=before[start:end]; pos=end
                first=block.split(':',1)[0]
                if dead.search(first):
                  chunks.append(block); continue
                new=block
                for pat,repl in simple:
                  new,n=pat.subn(repl,new)
                  if n: file_changes.append((pat.pattern,repl,n,first))
                for pat,repl in state_pats:
                  new,n=pat.subn(repl,new)
                  if n: file_changes.append((pat.pattern,repl,n,first))
                for old,repl in an되_map.items():
                  n=new.count(old)
                  if n:
                    new=new.replace(old,repl); file_changes.append((old,repl,n,first))
                for old,repl in an돼_map.items():
                  n=new.count(old)
                  if n:
                    new=new.replace(old,repl); file_changes.append((old,repl,n,first))
                chunks.append(new)
              chunks.append(before[pos:])
              after=''.join(chunks)
              if after==before: continue
              if len(mid_start.findall(before))!=len(mid_start.findall(after)): raise SystemExit(f'MID count changed: {p}')
              if ctrl.findall(before)!=ctrl.findall(after): raise SystemExit(f'control sequence changed: {p}')
              if before.count('\\n')!=after.count('\\n'): raise SystemExit(f'visual break count changed: {p}')
              if '\ufffd' in after: raise SystemExit(f'U+FFFD: {p}')
              p.write_text(after,encoding='utf-8',newline='')
              changed.append((p,file_changes))

          print('FILES_CHANGED',len(changed))
          for p,items in changed:
            print('FILE',p)
            for old,new,n,mid in items:
              print(' ',mid,'::',old,'=>',new,'x',n)
          PY
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/audit-awakening-korean-orthography.yml
          git add 'Awakening/Messages (K)' 'Awakening/DLC Message (K)'
          git commit -m 'Fix Awakening Korean spelling and spacing'
          git push