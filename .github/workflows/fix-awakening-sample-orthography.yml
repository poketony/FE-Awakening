name: Fix sampled Awakening orthography

on:
  push:
    paths:
      - ".github/workflows/fix-awakening-sample-orthography.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install width dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --quiet pillow

      - name: Apply context-reviewed fixes and validate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import re, subprocess
          from PIL import ImageFont

          edits = {
            "Awakening/Messages (K)/005.txt": {
              "MID_005_OP3_06": [("거라구요", "거라고요", 1)],
            },
            "Awakening/Messages (K)/マリアベル_リベラ.txt": {
              "MID_支援_マリアベル_リベラ_Ｂ": [
                ("버림 받은", "버림받은", 1),
                ("평동", "평등", 1),
              ],
              "MID_支援_マリアベル_リベラ_Ａ": [("말슴", "말씀", 1)],
            },
            "Awakening/Messages (K)/サーリャ_ソール.txt": {
              "MID_支援_サーリャ_ソール_Ｃ": [("지켜 보고", "지켜보고", 2)],
            },
            "Awakening/Messages (K)/ティアモ_ロンクー.txt": {
              "MID_支援_ティアモ_ロンクー_Ａ": [("못 하지", "못하지", 1)],
            },
            "Awakening/Messages (K)/ヴィオール_オリヴィエ.txt": {
              "MID_支援_ヴィオール_オリヴィエ_Ａ": [("한번 더", "한 번 더", 1)],
              "MID_支援_ヴィオール_オリヴィエ_Ｓ": [("한번도", "한 번도", 1)],
            },
            "Awakening/Messages (K)/ジェローム_カラム_親子.txt": {
              "MID_支援_ジェローム_カラム_親子_Ｂ": [("거 잖아", "거잖아", 1)],
            },
            "Awakening/Messages (K)/ンン_フレデリク_親子.txt": {
              "MID_支援_ンン_フレデリク_親子_Ｃ": [("업습니다", "없습니다", 1)],
            },
            "Awakening/Messages (K)/様子_セレナ2.txt": {
              "MID_様子_セレナ_後_恋人": [("바람 피면", "바람피우면", 1)],
            },
            "Awakening/DLC Message (K)/19. 가장 강한 자의 이름.txt": {
              "MID_E000_WIN1_SP2": [("5연전를", "5연전을", 1)],
              "MID_E000_戦いをやめる？_N4": [("걸맞는", "걸맞은", 1)],
            },
          }

          # Context-reviewed non-errors that must remain untouched.
          preserve = {
            "Awakening/Messages (K)/005.txt": [
              "우리 나라의 병사를",
              "우리 나라에 숨어들어서",
            ],
            "Awakening/Messages (K)/ジェローム_カラム_親子.txt": [
              "얼굴이 풀려있었으니까",
            ],
          }

          control_re = re.compile(r"\$[A-Za-z][A-Za-z0-9]*")
          before = {}
          changed_segments = []
          total = 0

          for pstr, mids in edits.items():
            path = Path(pstr)
            raw = path.read_bytes()
            old = raw.decode("utf-8", errors="strict")
            before[path] = old
            lines = old.splitlines(keepends=True)
            seen = set()
            out = []

            for lineno, line in enumerate(lines, 1):
              if not line.startswith("MID_"):
                out.append(line)
                continue
              mid = line.split(":", 1)[0]
              new_line = line
              if mid in mids:
                seen.add(mid)
                for old_s, new_s, expected_count in mids[mid]:
                  actual = new_line.count(old_s)
                  if actual != expected_count:
                    raise SystemExit(f"{path} {mid}: expected {expected_count}x {old_s!r}, found {actual}")
                  new_line = new_line.replace(old_s, new_s)
                  total += expected_count
                  changed_segments.append((path, lineno, mid, old_s, new_s))
              out.append(new_line)

            missing = set(mids) - seen
            if missing:
              raise SystemExit(f"Missing MID(s) in {path}: {sorted(missing)}")

            new = "".join(out)
            path.write_bytes(new.encode("utf-8"))

          if total != 14:
            raise SystemExit(f"Expected 14 edits, got {total}")

          # Explicitly preserve forms determined correct after context review.
          for pstr, phrases in preserve.items():
            text = Path(pstr).read_text(encoding="utf-8")
            for phrase in phrases:
              if phrase not in text:
                raise SystemExit(f"Context-preserved phrase changed unexpectedly: {pstr} / {phrase}")

          # Integrity validation.
          for path, old in before.items():
            new = path.read_bytes().decode("utf-8", errors="strict")
            if "\ufffd" in new:
              raise SystemExit(f"U+FFFD found: {path}")
            if any(ord(ch) < 32 and ch not in "\n\r\t" for ch in new):
              raise SystemExit(f"Bad C0 control: {path}")

            old_mids = [x.split(":",1)[0] for x in old.splitlines() if x.startswith("MID_")]
            new_mids = [x.split(":",1)[0] for x in new.splitlines() if x.startswith("MID_")]
            if old_mids != new_mids:
              raise SystemExit(f"MID count/order changed: {path}")
            if control_re.findall(old) != control_re.findall(new):
              raise SystemExit(f"Control-code sequence changed: {path}")
            if old.count("\\n") != new.count("\\n"):
              raise SystemExit(f"Literal \\n count changed: {path}")

            # Rebuild exactly the expected new file, MID by MID.
            expected_lines = []
            for line in old.splitlines(keepends=True):
              exp = line
              if line.startswith("MID_"):
                mid = line.split(":",1)[0]
                if mid in edits[str(path)]:
                  for old_s, new_s, _ in edits[str(path)][mid]:
                    exp = exp.replace(old_s, new_s)
              expected_lines.append(exp)
            if "".join(expected_lines) != new:
              raise SystemExit(f"Unexpected diff outside approved edits: {path}")

          # Proxy width check on changed visual segments.
          font = ImageFont.truetype("/usr/share/fonts/truetype/nanum/NanumGothic.ttf", 14)
          thresholds = {"t0": 278.8125, "t1": 298.734375}

          def strip_codes(s):
            s = re.sub(r"\$S(?:bp|sp|vp)[^|]*\|(?:\d+\|)?", "", s)
            s = re.sub(r"\$W[ms][^|]*\|\d*", "", s)
            s = re.sub(r"\$E[^|]*\|", "", s)
            s = re.sub(r"\$[A-Za-z][A-Za-z0-9]*\|?", "", s)
            return s

          failures=[]
          checked=0
          for path, lineno, mid, old_s, new_s in changed_segments:
            line = path.read_text(encoding="utf-8").splitlines()[lineno-1]
            style = "t0" if "$t0" in line else ("t1" if "$t1" in line else None)
            if not style:
              continue
            payload = line.split(":",1)[1]
            for seg in re.split(r"\\n|\$k|\$p", payload):
              if new_s not in seg:
                continue
              visible=strip_codes(seg).strip()
              width=font.getlength(visible)
              checked += 1
              if width > thresholds[style]:
                failures.append((path,mid,width,thresholds[style],visible))
          if failures:
            for x in failures:
              print("WIDTH_FAIL", x)
            raise SystemExit(f"{len(failures)} width failures")

          subprocess.run(["git","diff","--check"],check=True)
          print(f"Context-reviewed edits: {total}")
          print(f"Changed files: {len(edits)}")
          print(f"Width-checked changed segments: {checked}")
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-awakening-sample-orthography.yml
          git add "Awakening/Messages (K)" "Awakening/DLC Message (K)"
          git diff --cached --check
          git commit -m "Fix sampled Awakening Korean orthography"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)"
