          for p,o,n in rules: by_file[p].append((o,n))

          before={}
          changed_records=[]
          rule_counts=Counter()
          changed_files=[]

          for pstr, file_rules in by_file.items():
            path=Path(pstr)
            raw=path.read_bytes()
            old=raw.decode("utf-8",errors="strict")
            before[path]=old
            lines=old.splitlines(keepends=True)
            out=[]
            changed=False
            for lineno,line in enumerate(lines,1):
              new_line=line
              if line.startswith("MID_"):
                mid=line.split(":",1)[0]
                if not any(m in mid for m in dead_markers):
                  for old_s,new_s in file_rules:
                    n=new_line.count(old_s)
                    if n:
                      rule_counts[(pstr,old_s,new_s)] += n
                      changed_records.append((path,lineno,mid,old_s,new_s,n))
                      new_line=new_line.replace(old_s,new_s)
              if new_line!=line: changed=True
              out.append(new_line)
            if changed:
              path.write_bytes("".join(out).encode("utf-8"))
              changed_files.append(path)

          missing=[(p,o,n) for p,o,n in rules if rule_counts[(p,o,n)]==0]
          if missing:
            print("MISSING RULES:")
            for x in missing: print(x)
            raise SystemExit(f"{len(missing)} context-reviewed rules did not match latest main")

          # Integrity + exact-diff reconstruction.
          for path in changed_files:
            old=before[path]
            new=path.read_bytes().decode("utf-8",errors="strict")
            if "\ufffd" in new: raise SystemExit(f"U+FFFD: {path}")
            bad=[ord(ch) for ch in new if ord(ch)<32 and ch not in "\n\r\t"]
            if bad: raise SystemExit(f"Bad C0: {path} {bad[:5]}")
            old_mids=[x.split(":",1)[0] for x in old.splitlines() if x.startswith("MID_")]
            new_mids=[x.split(":",1)[0] for x in new.splitlines() if x.startswith("MID_")]
            if old_mids != new_mids: raise SystemExit(f"MID count/order changed: {path}")
            if control_re.findall(old) != control_re.findall(new):
              raise SystemExit(f"Control sequence changed: {path}")
            if old.count("\\n") != new.count("\\n"):
              raise SystemExit(f"Literal \\n changed: {path}")

            expected=[]
            file_rules=by_file[str(path)]
            for line in old.splitlines(keepends=True):
              exp=line
              if line.startswith("MID_"):
                mid=line.split(":",1)[0]
                if not any(m in mid for m in dead_markers):
                  for a,b in file_rules:
                    exp=exp.replace(a,b)
              expected.append(exp)
            if "".join(expected) != new:
              raise SystemExit(f"Unexpected diff: {path}")

            # Explicit dead-branch protection.
            old_lines=old.splitlines()
            new_lines=new.splitlines()
            if len(old_lines)!=len(new_lines): raise SystemExit(f"Physical line count changed: {path}")
            for a,b in zip(old_lines,new_lines):
              if a.startswith("MID_"):
                mid=a.split(":",1)[0]
                if any(m in mid for m in dead_markers) and a!=b:
                  raise SystemExit(f"Dead Avatar branch changed: {path} {mid}")

          # Width check for every changed visual segment in $t0/$t1 dialogue.
