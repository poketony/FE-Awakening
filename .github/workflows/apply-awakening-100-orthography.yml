          thresholds={"t0":278.8125,"t1":298.734375}

          def strip_codes(s):
            s=re.sub(r"\$S(?:bp|sp|vp|bs|bv)[^|]*\|(?:\d+\|)?","",s)
            s=re.sub(r"\$W[ms][^|]*\|\d*","",s)
            s=re.sub(r"\$E[^|]*\|","",s)
            s=re.sub(r"\$b[^|]*\|","",s)
            s=re.sub(r"\$[A-Za-z][A-Za-z0-9]*\|?","",s)
            return s

          touched={(str(p),ln) for p,ln,*_ in changed_records}
          width_checked=0
          failures=[]
          for path in changed_files:
            old_lines=before[path].splitlines()
            new_lines=path.read_text(encoding="utf-8").splitlines()
            for lineno,(old_line,new_line) in enumerate(zip(old_lines,new_lines),1):
              if (str(path),lineno) not in touched: continue
              style="t0" if "$t0" in new_line else ("t1" if "$t1" in new_line else None)
              if not style: continue
              old_payload=old_line.split(":",1)[1] if ":" in old_line else old_line
              new_payload=new_line.split(":",1)[1] if ":" in new_line else new_line
              old_segs=re.split(r"\\n|\$k|\$p",old_payload)
              new_segs=re.split(r"\\n|\$k|\$p",new_payload)
              if len(old_segs)!=len(new_segs): raise SystemExit(f"Visual segment structure changed: {path}:{lineno}")
              for os,ns in zip(old_segs,new_segs):
                if os==ns: continue
                visible=strip_codes(ns).strip()
                if not visible: continue
                width=font.getlength(visible)
                width_checked += 1
                if width > thresholds[style]:
                  failures.append((str(path),lineno,style,width,thresholds[style],visible))
          if failures:
            for x in failures[:30]: print("WIDTH_FAIL",x)
            raise SystemExit(f"{len(failures)} changed visual segments exceed proxy width")

          subprocess.run(["git","diff","--check"],check=True)

          unique_mids={(str(p),mid) for p,_,mid,*_ in changed_records}
          print(f"RULES={len(rules)}")
          print(f"CHANGED_FILES={len(changed_files)}")
          print(f"LIVE_OCCURRENCES={sum(rule_counts.values())}")
          print(f"CHANGED_MIDS={len(unique_mids)}")
          print(f"WIDTH_CHECKED_SEGMENTS={width_checked}")
          print("=== APPLIED ===")
          for (p,o,n),c in sorted(rule_counts.items()):
            print(f"{c}\t{p}\t{o} => {n}")
          print("=== MIDS ===")
          for p,mid in sorted(unique_mids):
            print(f"{p}\t{mid}")
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-awakening-100-orthography.yml
          git add "Awakening/Messages (K)" "Awakening/DLC Message (K)"
          git diff --cached --check
          git commit -m "Fix Awakening Korean orthography from 100-file review"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)"
