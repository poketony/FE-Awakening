name: Finish Awakening 100-file review batch
on:
  push:
    paths: ['.github/workflows/review-awakening-100-fix.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-nanum
          python -m pip install --quiet pillow
      - name: Apply and validate reviewed changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import ImageFont
          import re,subprocess
          R=Path('Awakening/Messages (K)'); J=Path('Awakening/Messages (J)'); T=Path('Awakening/AUTOMATION_REVIEWED_FILES.txt')
          C={
          'アズール_ヘンリー_親子.txt':[('MID_支援_アズール_ヘンリー_親子_Ａ','소극적이여서','소극적이어서')],
          'アズール_プレイヤー男_親子.txt':[('MID_支援_アズール_プレイヤー男_親子_Ａ_PCM1','소극적이여서','소극적이어서')],
          'アズール_ドニ_親子.txt':[('MID_支援_アズール_ドニ_親子_Ａ','소극적이여서','소극적이어서')],
          'アズール_グレゴ_親子.txt':[('MID_支援_アズール_グレゴ_親子_Ａ','소극적이여서','소극적이어서')],
          'アズール_カラム_親子.txt':[('MID_支援_アズール_カラム_親子_Ａ','소극적이여서','소극적이어서')],
          'アズール_ロンクー_親子.txt':[('MID_支援_アズール_ロンクー_親子_Ａ','소극적이여서','소극적이어서')],
          'アズール_ガイア_親子.txt':[('MID_支援_アズール_ガイア_親子_Ａ','소극적이여서','소극적이어서'),('MID_支援_アズール_ガイア_親子_Ａ','다행인건가','다행인 건가')],
          'アズール_リベラ_親子.txt':[('MID_支援_アズール_リベラ_親子_Ａ','소극적이여서','소극적이어서')],
          'アズール_フレデリク_親子.txt':[('MID_支援_アズール_フレデリク_親子_Ａ','소극적이여서','소극적이어서')],
          'アズール_クロム_親子.txt':[('MID_支援_アズール_クロム_親子_Ａ','소극적이여서','소극적이어서')],
          'ガイア_ベルベット.txt':[('MID_支援_ガイア_ベルベット_Ｓ','들을 수록','들을수록')],
          'ガイア_ソワレ.txt':[('MID_支援_ガイア_ソワレ_Ｓ','계속 하자','계속하자'),('MID_支援_ガイア_ソワレ_Ｓ','계속 할 거야','계속할 거야')],
          'ウード_プレイヤー男.txt':[('MID_支援_ウード_プレイヤー男_Ａ_PCM1','한번에 베어 낸다','한 번에 베어 낸다')],
          'ウード_プレイヤー男_親子.txt':[('MID_支援_ウード_プレイヤー男_親子_Ｂ_PCM1','위험할 뻔 했군','위험할 뻔했군')],
          'ウード_カラム_親子.txt':[('MID_支援_ウード_カラム_親子_Ｂ','위험할 뻔 했어','위험할 뻔했어')],
          'ウード_フレデリク_親子.txt':[('MID_支援_ウード_フレデリク_親子_Ｂ','위험할 뻔 했습니다','위험할 뻔했습니다')],
          'ウード_リヒト_親子.txt':[('MID_支援_ウード_リヒト_親子_Ｂ','위험할 뻔 했네','위험할 뻔했네')],
          'ウード_ソール_親子.txt':[('MID_支援_ウード_ソール_親子_Ｂ','위험할 뻔 했다','위험할 뻔했다')],
          'ウード_ガイア_親子.txt':[('MID_支援_ウード_ガイア_親子_Ｂ','위험할 뻔 했다','위험할 뻔했다')],
          'ウード_セレナ.txt':[('MID_支援_ウード_セレナ_Ａ','달려 가겠어','달려가겠어')],
          'インバース_プレイヤー男.txt':[('MID_支援_インバース_プレイヤー男_Ｓ_PCM1','알아 차려','알아차려')],
          'カラム_マリアベル.txt':[('MID_支援_カラム_マリアベル_Ｂ','불안 하고 외로워서','불안하고 외로워서')]}
          rev={x for x in T.read_text(encoding='utf-8').splitlines() if x.startswith('Awakening/Messages (K)/')}; B=[]
          for p in sorted(R.glob('*.txt'),key=lambda x:x.name):
              if str(p) in rev: continue
              t=p.read_text(encoding='utf-8')
              if 'MID_支援_' not in t or not (J/p.name).exists(): continue
              if p.name.endswith('_ルキナ.txt') and (R/(p.name[:-8]+'_マルス.txt')).exists(): continue
              B.append(p)
              if len(B)==100: break
          assert len(B)==100 and set(C)<=set(p.name for p in B)
          mr=re.compile(r'^(MID_[^:]+): (.*)$',re.M); cr=re.compile(r'\$[A-Za-z][A-Za-z0-9]*'); dr=re.compile(r'_(?:PCM[23]|PCF[23])(?:$|_)'); f=ImageFont.truetype('/usr/share/fonts/truetype/nanum/NanumGothic.ttf',14)
          def M(t):
              ms=list(mr.finditer(t)); d={}
              for i,m in enumerate(ms): d[m.group(1)]=t[m.start(2):(ms[i+1].start() if i+1<len(ms) else len(t))].rstrip('\r\n')
              return d,[m.group(1) for m in ms]
          def S(x):
              x=re.sub(r'\$S(?:bp|sp|vp|bs|bv|ls|lp)[^|]*\|(?:\d+\|)?','',x); x=re.sub(r'\$W[ms][^|]*\|\d*','',x); x=re.sub(r'\$E[^|]*\|','',x); x=re.sub(r'\$b[^|]*\|','',x); return re.sub(r'\$[A-Za-z][A-Za-z0-9]*\|?','',x)
          n=0
          for fn,reps in C.items():
              p=R/fn; o=p.read_text(encoding='utf-8'); z=o; om,oo=M(o)
              for mid,a,b in reps:
                  assert om[mid].count(a)==1
                  s=z.find(mid+': '); e=z.find('\nMID_',s+1); e=len(z) if e<0 else e; q=z[s:e]; assert q.count(a)==1; z=z[:s]+q.replace(a,b,1)+z[e:]; n+=1
              nm,no=M(z); assert oo==no and cr.findall(o)==cr.findall(z) and o.count('\\n')==z.count('\\n')
              assert '\ufffd' not in z and not any(ord(c)<32 and c not in '\n\r\t' for c in z)
              for m,v in om.items():
                  if dr.search(m): assert nm[m]==v
              exp=o
              for mid,a,b in reps:
                  s=exp.find(mid+': '); e=exp.find('\nMID_',s+1); e=len(exp) if e<0 else e; q=exp[s:e]; exp=exp[:s]+q.replace(a,b,1)+exp[e:]
              assert exp==z
              for mid,a,b in reps:
                  lim=278.8125 if '$t0' in nm[mid] else 298.734375; ls=[S(x) for x in re.split(r'\\n|\$k|\$p',nm[mid])]; ls=[x for x in ls if b in x]; assert ls; w=f.getlength(ls[0]); print('WIDTH',w,lim,fn,ls[0]); assert w<=lim
              p.write_text(z,encoding='utf-8')
          for p in B:
              t=p.read_bytes().decode('utf-8','strict'); assert '\ufffd' not in t and not any(ord(c)<32 and c not in '\n\r\t' for c in t)
          tt=T.read_text(encoding='utf-8'); E=set(tt.splitlines());
          if not tt.endswith('\n'): tt+='\n'
          for p in B:
              if str(p) not in E: tt+=str(p)+'\n'; E.add(str(p))
          T.write_text(tt,encoding='utf-8'); subprocess.run(['git','diff','--check'],check=True); print('REVIEWED',len(B),'CHANGED_FILES',len(C),'CHANGES',n)
          PY
      - name: Commit reviewed batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/review-awakening-100.yml .github/workflows/review-awakening-100-fix.yml
          git add "Awakening/Messages (K)" Awakening/AUTOMATION_REVIEWED_FILES.txt
          git diff --cached --check
          git commit -m "Review 100 Awakening support dialogue files"
          git push origin HEAD:main
          git rev-parse HEAD
