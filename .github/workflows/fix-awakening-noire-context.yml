name: Fix Awakening Noire context lines

on:
  push:
    paths:
      - ".github/workflows/fix-awakening-noire-context.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install width dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --quiet pillow

      - name: Apply and validate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess
          from PIL import ImageFont

          p=Path("Awakening/Messages (K)/ウード_ノワール.txt")
          old=p.read_bytes().decode("utf-8","strict")
          new=old

          rules=[
            ("먹은 뒤의 소감을… 그,\\n시인 오웬가… 말해줄 수 있을까?",
             "먹은 뒤의 소감은… 그,\\n시인 오웬에게… 부탁해도 될까?"),
            ("그래! 그리고 성 안에서는\\n왕자와 공주의 혼약하고 있지…!",
             "그래! 그리고 성 안에서는\\n왕자와 공주의 혼약이지…!"),
          ]

          for a,b in rules:
            n=new.count(a)
            if n!=1:
              raise SystemExit(f"expected exactly 1 match: {a!r}, got {n}")
            new=new.replace(a,b)

          p.write_bytes(new.encode("utf-8"))

          # integrity
          chk=p.read_bytes().decode("utf-8","strict")
          if "\ufffd" in chk: raise SystemExit("U+FFFD")
          if any(ord(ch)<32 and ch not in "\n\r\t" for ch in chk):
            raise SystemExit("C0")

          om=[x.split(":",1)[0] for x in old.splitlines() if x.startswith("MID_")]
          nm=[x.split(":",1)[0] for x in chk.splitlines() if x.startswith("MID_")]
          if om!=nm: raise SystemExit("MID order/count changed")

          cre=re.compile(r"\$[A-Za-z][A-Za-z0-9]*")
          if cre.findall(old)!=cre.findall(chk):
            raise SystemExit("control code sequence changed")
          if old.count("\\n")!=chk.count("\\n"):
            raise SystemExit("literal newline structure changed")

          expected=old
          for a,b in rules: expected=expected.replace(a,b)
          if chk!=expected: raise SystemExit("unexpected diff")

          # width check: changed visual segments only, t1
          font=ImageFont.truetype("/usr/share/fonts/truetype/nanum/NanumGothic.ttf",14)
          limit=298.734375
          def strip(s):
            s=re.sub(r"\$S(?:bp|sp|vp|bs|bv)[^|]*\|(?:\d+\|)?","",s)
            s=re.sub(r"\$W[ms][^|]*\|\d*","",s)
            s=re.sub(r"\$E[^|]*\|","",s)
            s=re.sub(r"\$b[^|]*\|","",s)
            s=re.sub(r"\$[A-Za-z][A-Za-z0-9]*\|?","",s)
            return s

          checked=0
          for o,n in zip(old.splitlines(),chk.splitlines()):
            if o==n: continue
            if not o.startswith("MID_") or "$t1" not in n: continue
            op=o.split(":",1)[1]
            np=n.split(":",1)[1]
            os=re.split(r"\\n|\$k|\$p",op)
            ns=re.split(r"\\n|\$k|\$p",np)
            if len(os)!=len(ns): raise SystemExit("visual segment structure changed")
            for a,b in zip(os,ns):
              if a==b: continue
              vis=strip(b).strip()
              if not vis: continue
              checked += 1
              w=font.getlength(vis)
              print(f"WIDTH {w:.3f}/{limit:.3f} :: {vis}")
              if w>limit:
                raise SystemExit(f"width overflow: {vis}")

          subprocess.run(["git","diff","--check"],check=True)
          print(f"WIDTH_SEGMENTS={checked}")
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-awakening-noire-context.yml
          git add "Awakening/Messages (K)/ウード_ノワール.txt"
          git diff --cached --check
          git commit -m "Fix Awakening Noire support dialogue"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)"
