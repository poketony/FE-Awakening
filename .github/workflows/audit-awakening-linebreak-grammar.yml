name: Audit Awakening line-break grammar
on:
  push:
    paths: ['.github/workflows/audit-awakening-linebreak-grammar.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit live dialogue branches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('Awakening/Messages (K)'),Path('Awakening/DLC Message (K)')]
          midre=re.compile(r'^(MID_[^:]+): (.*)$',re.M)
          dead=re.compile(r'_(?:PCM[23]|PCF[23])(?:$|_)')
          # Explicit visual-break grammar candidates. Keep broad enough to inspect context manually.
          pats=[
            ('수',re.compile(r'([^$|\\]{1,28})\\n(수(?:가|는|도|만|밖에|조차|마저)?\s|수[.!?,…]|수$)')),
            ('것',re.compile(r'([^$|\\]{1,28})\\n(것(?:이|은|을|도|만|처럼|같|뿐|밖에)?\s|것[.!?,…]|것$)')),
            ('줄',re.compile(r'([^$|\\]{1,28})\\n(줄(?:은|을|도|만)?\s|줄[.!?,…]|줄$)')),
            ('리',re.compile(r'([^$|\\]{1,28})\\n(리(?:가|는|도)?\s|리[.!?,…]|리$)')),
            ('바',re.compile(r'([^$|\\]{1,28})\\n(바(?:가|는|를|도)?\s|바[.!?,…]|바$)')),
            ('데',re.compile(r'([^$|\\]{1,28})\\n(데(?:가|는|를|도)?\s|데[.!?,…]|데$)')),
            ('뿐',re.compile(r'([^$|\\]{1,28})\\n(뿐(?:이|은|을|도|만)?\s|뿐[.!?,…]|뿐$)')),
            ('듯',re.compile(r'([^$|\\]{1,28})\\n(듯(?:이|은|한|하다|해|했|도)?\s|듯[.!?,…]|듯$)')),
            ('만큼',re.compile(r'([^$|\\]{1,28})\\n(만큼(?:은|도|만)?\s|만큼[.!?,…]|만큼$)')),
            ('대로',re.compile(r'([^$|\\]{1,28})\\n(대로(?:는|도|만)?\s|대로[.!?,…]|대로$)')),
            ('particle',re.compile(r'([^$|\\]{1,28})\\n(은|는|이|가|을|를|의|에|에서|에게|께|와|과|도|만|부터|까지|보다|처럼|으로|로)(?=\s|[^가-힣]|$)')),
          ]
          rows=[]
          for root in roots:
            for p in sorted(root.glob('*.txt')):
              text=p.read_text(encoding='utf-8')
              ms=list(midre.finditer(text))
              for i,m in enumerate(ms):
                name=m.group(1)
                if dead.search(name): continue
                body=m.group(2)
                for label,pat in pats:
                  for x in pat.finditer(body):
                    a=max(0,x.start()-100); b=min(len(body),x.end()+100)
                    ctx=body[a:b]
                    rows.append((str(p),name,label,x.group(0),ctx))
          print('CANDIDATES',len(rows))
          for i,(p,n,l,hit,ctx) in enumerate(rows,1):
            print(f'@@CANDIDATE {i}@@')
            print('FILE',p)
            print('MID',n)
            print('TYPE',l)
            print('HIT',hit)
            print('CONTEXT',ctx)
          PY