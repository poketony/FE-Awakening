name: Audit Awakening text integrity

on:
  push:
    paths:
      - '.github/workflows/chatgpt-audit-awakening-texts.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit all Awakening text files
        shell: python
        run: |
          from pathlib import Path
          import subprocess, json, re

          root = Path('Awakening')
          files = sorted(root.rglob('*.txt'))
          base = 'b747d39'
          issues = []
          stats = {'all_txt': len(files), 'k_txt': 0, 'j_txt': 0}

          def add(path, kind, detail):
              issues.append({'path': str(path), 'kind': kind, 'detail': detail})

          for p in files:
              rel = str(p).replace('\\','/')
              if '/Messages (K)/' in '/' + rel:
                  stats['k_txt'] += 1
              if '/Messages (J)/' in '/' + rel:
                  stats['j_txt'] += 1
              data = p.read_bytes()
              try:
                  text = data.decode('utf-8-sig')
              except UnicodeDecodeError as e:
                  add(p, 'INVALID_UTF8', f'{e.start}:{e.reason}')
                  continue

              if '\ufffd' in text:
                  add(p, 'REPLACEMENT_CHAR', f'count={text.count(chr(0xfffd))}')

              bad_controls = [(i, ord(ch)) for i, ch in enumerate(text) if ord(ch) < 32 and ch not in '\t\n\r']
              if bad_controls:
                  sample = ','.join(f'{i}:U+{cp:04X}' for i,cp in bad_controls[:12])
                  add(p, 'CONTROL_CHARS', f'count={len(bad_controls)} sample={sample}')

              # Suspicious mojibake / encoding garbage indicators.
              mojis = ['�', 'Ã', 'Â', 'ì', 'ë', 'í', 'ðŸ']
              hits = sum(text.count(x) for x in mojis)
              if hits >= 3:
                  add(p, 'MOJIBAKE', f'indicator_hits={hits}')

              if '/Messages (K)/' in '/' + rel:
                  lines = text.splitlines()
                  mids = [ln for ln in lines if ln.startswith('MID_')]
                  if not mids:
                      add(p, 'NO_MID', 'no MID_ records')
                  malformed = [ln[:120] for ln in mids if ': ' not in ln]
                  if malformed:
                      add(p, 'MALFORMED_MID', f'count={len(malformed)} sample={malformed[:2]}')
                  dup = []
                  seen = set()
                  for ln in mids:
                      mid = ln.split(': ',1)[0]
                      if mid in seen: dup.append(mid)
                      seen.add(mid)
                  if dup:
                      add(p, 'DUPLICATE_MID', f'count={len(dup)} sample={dup[:5]}')

              # Compare size against known-good pre-review baseline where file existed.
              try:
                  old = subprocess.check_output(['git','show',f'{base}:{rel}'], stderr=subprocess.DEVNULL)
                  if len(old) and (len(data) < len(old)*0.60 or len(data) > len(old)*1.60):
                      add(p, 'SIZE_JUMP', f'current={len(data)} base={len(old)} ratio={len(data)/len(old):.2f}')
              except subprocess.CalledProcessError:
                  pass

          print('AUDIT_STATS ' + json.dumps(stats, ensure_ascii=False))
          print('AUDIT_ISSUES_BEGIN')
          for x in issues:
              print(json.dumps(x, ensure_ascii=False))
          print('AUDIT_ISSUES_END')
          print('AUDIT_ISSUE_COUNT', len(issues))

          # Also list every Awakening text changed since the pre-review baseline.
          try:
              out = subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD','--','Awakening'], text=True)
              changed = [x for x in out.splitlines() if x.endswith('.txt')]
          except Exception:
              changed = []
          print('CHANGED_SINCE_BASE_BEGIN')
          for x in changed:
              print(x)
          print('CHANGED_SINCE_BASE_END')
          print('CHANGED_SINCE_BASE_COUNT', len(changed))
