name: Adjust Awakening reviewed wording

on:
  push:
    paths:
      - ".github/workflows/adjust-awakening-reviewed-wording.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact MID edits
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess

          edits = {
            "Awakening/Messages (K)/005.txt": {
              "MID_005_OP3_06": [("펠레지아로 데려온 거라고요!", "펠레지아로 데려온 거라구요!", 1)],
            },
            "Awakening/Messages (K)/ジェローム_カラム_親子.txt": {
              "MID_支援_ジェローム_カラム_親子_Ａ": [("얼굴이 풀려있었으니까", "얼굴이 풀려 있었으니까", 1)],
            },
          }

          control_re = re.compile(r"\$[A-Za-z][A-Za-z0-9]*")
          total = 0

          for pstr, mids in edits.items():
            path = Path(pstr)
            old = path.read_text(encoding="utf-8")
            old_mids = [x.split(":",1)[0] for x in old.splitlines() if x.startswith("MID_")]
            old_controls = control_re.findall(old)
            old_n = old.count("\\n")

            lines = old.splitlines(keepends=True)
            out = []
            seen=set()
            for line in lines:
              new=line
              if line.startswith("MID_"):
                mid=line.split(":",1)[0]
                if mid in mids:
                  seen.add(mid)
                  for a,b,n in mids[mid]:
                    c=new.count(a)
                    if c != n:
                      raise SystemExit(f"{pstr} {mid}: expected {n}x {a!r}, found {c}")
                    new=new.replace(a,b)
                    total += n
              out.append(new)

            if set(mids) != seen:
              raise SystemExit(f"Missing MID in {pstr}: {set(mids)-seen}")

            new="".join(out)
            path.write_text(new,encoding="utf-8",newline="")

            if [x.split(":",1)[0] for x in new.splitlines() if x.startswith("MID_")] != old_mids:
              raise SystemExit(f"MID changed: {pstr}")
            if control_re.findall(new) != old_controls:
              raise SystemExit(f"Control sequence changed: {pstr}")
            if new.count("\\n") != old_n:
              raise SystemExit(f"Literal \\n changed: {pstr}")
            if "\ufffd" in new:
              raise SystemExit(f"U+FFFD: {pstr}")

          if total != 2:
            raise SystemExit(f"Expected 2 edits, got {total}")

          subprocess.run(["git","diff","--check"],check=True)
          print("Reviewed edits:", total)
          PY

      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/adjust-awakening-reviewed-wording.yml
          git add "Awakening/Messages (K)/005.txt" "Awakening/Messages (K)/ジェローム_カラム_親子.txt"
          git diff --cached --check
          git commit -m "Adjust reviewed Awakening dialogue spelling"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)"
