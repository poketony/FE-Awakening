          overlap=[p for p in manifest if p in existing]
          if overlap: raise SystemExit(f'already tracked: {overlap}')
          if len(manifest)!=50 or len(set(manifest))!=50: raise SystemExit('manifest is not exactly 50 unique files')
          base={}
          for rel in manifest:
              p=Path(rel)
              text=p.read_text(encoding='utf-8')
              base[rel]=text
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h!=base_hash[rel]: raise SystemExit(f'base drift: {rel} {h} != {base_hash[rel]}')
          def edit(rel, pairs):
              p=Path(rel); out=[]
              for line in p.read_text(encoding='utf-8').splitlines(keepends=True):
                  if line.startswith('MID_') and ': ' in line:
                      mid=line.split(': ',1)[0]
                      if not dead.search(mid):
                          for a,b in pairs:
                              line=line.replace(a,b)
                  out.append(line)
              p.write_text(''.join(out),encoding='utf-8')
          for rel,pairs in reps.items(): edit(rel,pairs)
          changed=[]
          for rel in manifest:
              p=Path(rel); b=p.read_text(encoding='utf-8'); a=base[rel]
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h!=final_hash[rel]: raise SystemExit(f'final hash mismatch: {rel} {h} != {final_hash[rel]}')
              if a!=b: changed.append(rel)
              if '\ufffd' in b or any(ord(c)<32 and c not in '\n\r\t' for c in b): raise SystemExit(f'encoding/C0: {rel}')
              if midre.findall(a)!=midre.findall(b): raise SystemExit(f'MID order: {rel}')
              if ctrl.findall(a)!=ctrl.findall(b): raise SystemExit(f'control sequence: {rel}')
              if [x.count('\\n') for x in a.splitlines()] != [x.count('\\n') for x in b.splitlines()]: raise SystemExit(f'literal n: {rel}')
              da={m.group(1):m.group(0) for m in re.finditer(r'^(MID_[^:]+):.*$',a,re.M) if dead.search(m.group(1))}
              db={m.group(1):m.group(0) for m in re.finditer(r'^(MID_[^:]+):.*$',b,re.M) if dead.search(m.group(1))}
              if da!=db: raise SystemExit(f'dead avatar branch: {rel}')
          if len(changed)!=21: raise SystemExit(f'expected 21 changed dialogue files, got {len(changed)}: {changed}')
          tracker.write_text(old_tracker+''.join(p+'\n' for p in manifest),encoding='utf-8')
          print('VALIDATED_50')
          print('CHANGED_21')
          for p in changed: print(p)
