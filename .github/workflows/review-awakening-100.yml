          reps={'Awakening/Messages (K)/ヘンリー_リヒト.txt': [('갱렐이 전장에 나서기 전에\\n쓰러져 버려서,', '전장에 나갈 기회가 별로 없는 사이\\n갱렐이 쓰러져 버려서,'), ('지금 처럼 아무 신경 안 쓰겠지', '지금처럼 아무 신경 안 쓰겠지')], 'Awakening/Messages (K)/ンン_プレイヤー男_親子.txt': [('딸한테 할만한 말이 아니잖냐', '딸한테 할 만한 말이 아니잖냐'), ('죄… 죄송합니, 다.', '죄… 죄송합니다.')], 'Awakening/Messages (K)/デジェル_クロム_親子.txt': [('…키, 데젤. 신경 쓰지 마라!', '…시, 신경 쓰지 마라, 데젤!')], 'Awakening/Messages (K)/グレゴ_ロンクー.txt': [('요즘 일만 하고 있어서 말이지.', '요즘 계속 공짜로 일만 하고 있어서 말이지.')], 'Awakening/Messages (K)/プレイヤー男_ベルベット.txt': [('당신을 원망한다고 생각하면 오산이야.', '당신을 원망하는 건 이치에 맞지 않아.'), ('잊어 버려', '잊어버려')], 'Awakening/Messages (K)/様子_マルス3.txt': [('전 여가 시간을 엉망으로 쓰나 봐요.\\n$Np, 여가 시간에 뭘 하나요?', '$Np, 여가 시간에는\\n무엇을 하며 지내나요?'), ('전 여가 시간을 엉망으로 쓰나 봐요.\\n$Np씨는 여가 시간에 뭘 하나요?', '$Np씨는 여가 시간에\\n무엇을 하며 지내나요?')], 'Awakening/Messages (K)/様子_シャンブレー4.txt': [('토끼의 보호를 받으면서 힘내 줘!', '토끼가 지켜 줄 테니까, 힘내!'), ('토끼의 보호를 받으면서 힘내 주세요!', '토끼가 지켜 드릴 테니, 힘내 주세요!')], 'Awakening/Messages (K)/様子_バジーリオ3.txt': [('외모가 좀 화려해졌는걸.', '조금 더 예뻐졌는걸.'), ('전보다 화려해진 거 아냐?', '전보다 예뻐진 거 아냐?'), ('정말로 걱정된다고.', '나답지 않게 걱정되는군.')], 'Awakening/Messages (K)/様子_セルジュ2.txt': [('기분은 생각한 그때 전하지 않으면 안 되니까.', '마음은 들었을 때 바로 전해야 하니까.')], 'Awakening/Messages (K)/Card.txt': [('방문해 주면 기쁘겠어.', '고용해 주면 기쁘겠어.')], 'Awakening/Messages (K)/ノワール_サーリャ_親子.txt': [('…이제 됐어. 말이 안 통하네….', '…이제 됐어. 더는 못 상대하겠어….'), ('다른 배울 건 많아.', '그 밖에 가르칠 건 많아.')], 'Awakening/Messages (K)/ブレディ_リヒト_親子.txt': [('자식이 태어났다고 돌변하다니…', '아들이 태어났다고 널 버리는 짓은…'), ('내가 믿는 첫째 아들이니까!', '내가 정한 첫 번째 아들이니까!')], 'Awakening/Messages (K)/サイリ_プレイヤー男.txt': [('과거를 떠올림으로서', '과거를 떠올림으로써')], 'Awakening/Messages (K)/X018.txt': [('길을 서두르자.', '서둘러 가자.'), ('너를 따랐던 펠레지아 백성들도', '네가 다스리던 펠레지아 백성들도')], 'Awakening/Messages (K)/マーク男_ガイア_親子.txt': [('깨끗이 잊어 버린', '깨끗이 잊어버린'), ('내 얼굴을 반히 쳐다보는 건 어때?', '내 얼굴을 빤히 쳐다보는 건 어때?')], 'Awakening/Messages (K)/マーク男_フレデリク_親子.txt': [('깨끗이 잊어 버린', '깨끗이 잊어버린')], 'Awakening/Messages (K)/マーク女_ノノ_親子.txt': [('깨끗이 잊어 버린', '깨끗이 잊어버린')], 'Awakening/Messages (K)/021.txt': [('MID_021_ED3_03YN: 죽음을 받아들이겠습니까?', 'MID_021_ED3_03YN: 저항하지 않겠습니까?')], 'Awakening/Messages (K)/様子_シンシア3.txt': [('한가할 때 뭘 하냐고? 모두 무사한지 확인하곤 해!\\n난 있지, 모두가 건강하면 기뻐지거든.', '한가할 때? 모두 무사한지 확인하러 다녀!\\n이것도 히어로의 임무니까!')], 'Awakening/Messages (K)/ノノ_プレイヤー女.txt': [('배운지 얼마 안 돼서', '배운 지 얼마 안 돼서'), ('뭘 혼자 중얼 거려?', '뭘 혼자 중얼거려?'), ('잘 하는 게 많아서', '잘하는 게 많아서')], 'Awakening/Messages (K)/プレイヤー男_ブレディ.txt': [('존경할만한', '존경할 만한'), ('할만한', '할 만한')]}
          dead=re.compile(r'_(?:PCM[23]|PCF[23])(?:$|_)')
          midre=re.compile(r'^(MID_[^:]+):',re.M)
          ctrl=re.compile(r'\$[A-Za-z]+(?:[^$|\\n]*\|)?')
          def norm_text(p):
              return p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          def nh_text(s): return hashlib.sha256(s.encode('utf-8')).hexdigest()
          tracker=Path('Awakening/AUTOMATION_REVIEWED_FILES.txt')
          old_tracker=norm_text(tracker)
          existing={x.strip() for x in old_tracker.splitlines() if x.startswith('Awakening/')}
          overlap=[p for p in manifest if p in existing]
          if overlap: raise SystemExit(f'already tracked: {overlap}')
          if len(manifest)!=50 or len(set(manifest))!=50: raise SystemExit('manifest is not exactly 50 unique files')
          base={}
          for rel in manifest:
              p=Path(rel); text=norm_text(p); base[rel]=text
              h=nh_text(text)
              if h!=base_hash[rel]: raise SystemExit(f'normalized base drift: {rel} {h} != {base_hash[rel]}')
          def edit(rel,pairs):
              p=Path(rel); text=norm_text(p); out=[]
              for line in text.splitlines(keepends=True):
                  if line.startswith('MID_') and ': ' in line:
                      mid=line.split(': ',1)[0]
                      if not dead.search(mid):
                          for a,b in pairs: line=line.replace(a,b)
                  out.append(line)
              p.write_text(''.join(out),encoding='utf-8',newline='\n')
          for rel,pairs in reps.items(): edit(rel,pairs)
          changed=[]
          for rel in manifest:
              p=Path(rel); b=norm_text(p); a=base[rel]
              h=nh_text(b)
              if h!=final_hash[rel]: raise SystemExit(f'normalized final mismatch: {rel} {h} != {final_hash[rel]}')
              if a!=b: changed.append(rel)
              if '\ufffd' in b or any(ord(c)<32 and c not in '\n\r\t' for c in b): raise SystemExit(f'encoding/C0: {rel}')
              if midre.findall(a)!=midre.findall(b): raise SystemExit(f'MID order: {rel}')
              if ctrl.findall(a)!=ctrl.findall(b): raise SystemExit(f'control sequence: {rel}')
              if [x.count('\\n') for x in a.splitlines()] != [x.count('\\n') for x in b.splitlines()]: raise SystemExit(f'literal n: {rel}')
              da={m.group(1):m.group(0) for m in re.finditer(r'^(MID_[^:]+):.*$',a,re.M) if dead.search(m.group(1))}
              db={m.group(1):m.group(0) for m in re.finditer(r'^(MID_[^:]+):.*$',b,re.M) if dead.search(m.group(1))}
              if da!=db: raise SystemExit(f'dead avatar branch: {rel}')
          if len(changed)!=21: raise SystemExit(f'expected 21 changed dialogue files, got {len(changed)}: {changed}')
          tracker.write_text(old_tracker+''.join(p+'\n' for p in manifest),encoding='utf-8',newline='\n')
          print('VALIDATED_50')
          print('CHANGED_21')
          for p in changed: print(p)
          PY
          git diff --check
          git rm .github/workflows/review-awakening-100.yml
          git config user.name "github-actions[bot]"
