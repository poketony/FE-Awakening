name: Scan Awakening orthography batch 3
on:
  push:
    paths:
      - ".github/workflows/scan-awakening-orthography-batch3.yml"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan selected 100
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import re
          selected=[
            "Awakening/Messages (K)/023.txt",
            "Awakening/Messages (K)/007.txt",
            "Awakening/Messages (K)/014.txt",
            "Awakening/Messages (K)/021.txt",
            "Awakening/Messages (K)/003.txt",
