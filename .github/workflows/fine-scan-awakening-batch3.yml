            ("ANHAE",re.compile(r"(?<![가-힣])안해")),
            ("NOUN_HADA",re.compile(r"(?:사과|말|이야기|생각|연습|공부|설명|고백|행동|준비|계속|취급|결정|약속|응원|조사|대화|시작|도전|이해|정리|대답|질문|확인|소개|노력|걱정)\s+(?:해|했|할|하는|하고|하면|해서|하지|하자|하니|하라|하네|한다)")),
            ("COUNT",re.compile(r"(?:한번도|한번 더|두번|세번|몇번|한손|한걸음|한마디|두마디|한아름|한쪽|두쪽)")),
            ("DDEUT",re.compile(r"[가-힣]+(?:한듯|한 듯|는듯|는 듯|을듯|을 듯|ㄹ듯|듯한|듯이|듯해|듯하)")),
            ("TE",re.compile(r"[가-힣]+(?:할테|할 텐|일테|일 텐|될테|될 텐|했을테|했을 텐|였을테|였을 텐)")),
            ("MISC",re.compile(r"(?:어슬렁 거|어느순간|큰일났다|큰일 났|쉬게해|말한대로|원하는대로|시치미떼|우리집|부탁 받|압수 당|취급 받|잊어 버|마음 먹|그만 두|자신있|뭐하는|뭘하는|가슴 속|품을 채로|휩싼|쓰러면|생각치 못|우이하게|언뜻보면|만난듯|힘들테|사과 해|다가 오|다가 가|지켜 보는|어슬렁거리는|한손으로|다시한번|그 때|그때|이 때|저 때|오랫 동안|오랫동안|몇 천|몇천|몇 백|몇백)")),
            ("BAD_SPACE_PUNCT",re.compile(r"(?<!\$[A-Za-z])(?<!\$Nu)(?<!\$Np)[가-힣]\s+[,!?]")),
          ]
          for pstr in selected:
              t=Path(pstr).read_text(encoding="utf-8")
              for ln in t.splitlines():
                  if not ln.startswith("MID_"): continue
                  mid=ln.split(":",1)[0]
                  if any(x in mid for x in dead): continue
                  # Keep raw line; snippets centered on matches.
                  for lab,pat in pats:
                      for m in pat.finditer(ln):
                          a=max(0,m.start()-150); b=min(len(ln),m.end()+230)
                          print(f"HIT\t{lab}\t{pstr}\t{mid}\t{m.group(0)}\t{ln[a:b]}")
