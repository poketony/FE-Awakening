name: Awakening orthography pass 2 audit
on:
  push:
    paths: ['.github/workflows/orthography-pass2-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narrow high-confidence candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          dead=('PCM2','PCM3','PCF2','PCF3')
          bad=re.compile(r'(?:오랫만|왠일|왠만|금새|몇일|어쨋든|하마트면|제 대로|뿐만아니라|할 수록|갈 수록|볼 수록|것같|수 밖에|할텐데|할테니|할께|할 께|익숙치|깨끗히|곰곰히|일일히|틈틈히|번번히|솔직이|가만이|도저이|역활|희안|어의없|됬|됀|웬지|어떻해|되요|돼여|바램|설레임|가까와|반듯이|문안하다|건들이다|치루다|뒤치닥거리|댓가|댓가지|통채로|통째로|곱배기|곱빼기|안밖|안팎|희안하|희한하)')
          attached=re.compile(r'(?:할수|한것|하는것|될것|된것|되는것|갈수|볼수|먹을수|알수|없는것|있는것|할뿐|할듯|할만큼|할바|할리)(?=[가-힣])')
          rows=[]
          for root in [Path('Awakening/Messages (K)'),Path('Awakening/DLC Message (K)')]:
            for p in sorted(root.glob('*.txt')):
              text=p.read_text('utf-8')
              for m in re.finditer(r'^(MID_[^:]+): (.*?)(?=^MID_|\Z)',text,re.M|re.S):
                mid,body=m.group(1),m.group(2)
                if any(x in mid for x in dead): continue
                plain=re.sub(r'\$[A-Za-z][^$\\\n\r가-힣!?…。、！？ ]*\|?','',body)
                for label,pat in [('bad',bad),('attached',attached)]:
                  for h in pat.finditer(plain):
                    ctx=plain[max(0,h.start()-60):min(len(plain),h.end()+70)].replace('\n',' ').replace('\\n',' / ')
                    rows.append((str(p),mid,label,h.group(0),ctx))
          Path('.github/ORTHOGRAPHY_PASS2_NARROW.txt').write_text('COUNT='+str(len(rows))+'\n'+''.join('\t'.join(r)+'\n' for r in rows),encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/ORTHOGRAPHY_PASS2_NARROW.txt
          git commit -m 'Add narrowed Awakening orthography report'
          git push
