name: Scan Awakening orthography batch 2

on:
  push:
    paths:
      - ".github/workflows/scan-awakening-orthography-batch2.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new 100 files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import Counter, defaultdict
          import re

          selected = [
            "Awakening/Messages (K)/012.txt","Awakening/Messages (K)/024.txt","Awakening/Messages (K)/015.txt","Awakening/Messages (K)/020.txt","Awakening/Messages (K)/016.txt",
            "Awakening/Messages (K)/チキ_プレイヤー女.txt","Awakening/Messages (K)/フレデリク_ミリエル.txt","Awakening/Messages (K)/シャンブレー_セレナ.txt","Awakening/Messages (K)/ミリエル_リベラ.txt","Awakening/Messages (K)/X004.txt",
            "Awakening/Messages (K)/X007.txt","Awakening/Messages (K)/シンシア_セレナ.txt","Awakening/Messages (K)/ヴェイク_セルジュ.txt","Awakening/Messages (K)/ウード_マーク女.txt","Awakening/Messages (K)/ヘンリー_マリアベル.txt",
            "Awakening/Messages (K)/セルジュ_ロンクー.txt","Awakening/Messages (K)/フレデリク_リズ.txt","Awakening/Messages (K)/X013.txt","Awakening/Messages (K)/デジェル_マルス.txt","Awakening/Messages (K)/X017.txt",
            "Awakening/Messages (K)/フレデリク_ヘンリー.txt","Awakening/Messages (K)/シンシア_マルス.txt","Awakening/Messages (K)/プレイヤー男_リヒト.txt","Awakening/Messages (K)/ティアモ_リベラ.txt","Awakening/Messages (K)/スミア_ヘンリー.txt",
            "Awakening/Messages (K)/ティアモ_ベルベット.txt","Awakening/Messages (K)/ソワレ_リベラ.txt","Awakening/Messages (K)/セレナ_ブレディ.txt","Awakening/Messages (K)/オリヴィエ_フレデリク.txt","Awakening/Messages (K)/プレイヤー男_リベラ.txt",
            "Awakening/Messages (K)/サイリ_チキ.txt","Awakening/Messages (K)/Support_S.txt","Awakening/Messages (K)/ティアモ_ヘンリー.txt","Awakening/Messages (K)/カラム_ミリエル.txt","Awakening/Messages (K)/ヴェイク_ミリエル.txt",
            "Awakening/Messages (K)/セルジュ_ミリエル.txt","Awakening/Messages (K)/セルジュ_リヒト.txt","Awakening/Messages (K)/マルス_ロラン.txt","Awakening/Messages (K)/サーリャ_ドニ.txt","Awakening/Messages (K)/オリヴィエ_ベルベット.txt",
            "Awakening/Messages (K)/プレイヤー男_フレデリク.txt","Awakening/Messages (K)/ウード_ンン.txt","Awakening/Messages (K)/X002.txt","Awakening/Messages (K)/シャンブレー_ンン.txt","Awakening/Messages (K)/ヴェイク_マリアベル.txt",
            "Awakening/Messages (K)/グレゴ_ミリエル.txt","Awakening/Messages (K)/マーク女_ノワール_兄弟.txt","Awakening/Messages (K)/ウード_ノワール.txt","Awakening/Messages (K)/マルス_アズール_兄弟.txt","Awakening/Messages (K)/X014.txt",
            "Awakening/Messages (K)/アズール_マルス.txt","Awakening/Messages (K)/プレイヤー女_マーク男.txt","Awakening/Messages (K)/チュートリアル.txt","Awakening/Messages (K)/ec.txt","Awakening/Messages (K)/ベルベット_ロンクー.txt",
            "Awakening/Messages (K)/グレゴ_リズ.txt","Awakening/Messages (K)/プレイヤー男_ロンクー.txt","Awakening/Messages (K)/セルジュ_プレイヤー女.txt","Awakening/Messages (K)/ウード_シンシア.txt","Awakening/Messages (K)/ノノ_プレイヤー女.txt",
            "Awakening/Messages (K)/X011.txt","Awakening/Messages (K)/紹介文.txt","Awakening/Messages (K)/ミリエル_リヒト.txt","Awakening/Messages (K)/アズール_ジェローム.txt","Awakening/Messages (K)/ユニット作成.txt",
            "Awakening/Messages (K)/セルジュ_ドニ.txt","Awakening/Messages (K)/セレナ_デジェル.txt","Awakening/Messages (K)/マーク女_ンン_兄弟.txt","Awakening/Messages (K)/マーク女_ロラン_兄弟.txt","Awakening/Messages (K)/グレゴ_プレイヤー男.txt",
            "Awakening/Messages (K)/ブレディ_プレイヤー男_親子.txt","Awakening/Messages (K)/ウード_リベラ_親子.txt","Awakening/Messages (K)/ジェローム_ロンクー_親子.txt","Awakening/Messages (K)/マーク女_ベルベット_親子.txt","Awakening/Messages (K)/マルス_オリヴィエ_親子.txt",
            "Awakening/Messages (K)/ウード_ソール_親子.txt","Awakening/Messages (K)/ブレディ_ロンクー_親子.txt","Awakening/Messages (K)/マーク女_インバース_親子.txt","Awakening/Messages (K)/マーク男_バジーリオ_親子.txt","Awakening/Messages (K)/マーク男_レンハ_親子.txt",
            "Awakening/Messages (K)/ノワール_グレゴ_親子.txt","Awakening/Messages (K)/ロラン_リヒト_親子.txt","Awakening/Messages (K)/ロラン_ヴィオール_親子.txt","Awakening/Messages (K)/ノワール_ソール_親子.txt","Awakening/Messages (K)/シャンブレー_グレゴ_親子.txt",
            "Awakening/Messages (K)/様子_能力.txt","Awakening/Messages (K)/様子_ベルベット1.txt","Awakening/Messages (K)/様子_ブレディ2.txt","Awakening/Messages (K)/様子_ティアモ2.txt","Awakening/Messages (K)/様子_ノノ1.txt",
            "Awakening/Messages (K)/様子_ウード1.txt","Awakening/Messages (K)/様子_武器経験.txt","Awakening/Messages (K)/様子_ベルベット4.txt","Awakening/Messages (K)/様子_ロンクー2.txt","Awakening/Messages (K)/様子_ノノ2.txt",
            "Awakening/DLC Message (K)/3. 영령의 마법 부적3.txt","Awakening/DLC Message (K)/15. 빛 대 어둠 결전 편.txt","Awakening/DLC Message (K)/13. 빛 대 어둠 빛 편.txt","Awakening/DLC Message (K)/5. 미이라의 낙원.txt","Awakening/DLC Message (K)/16. 미궁의 추격전.txt"
          ]
          assert len(selected)==100 and len(set(selected))==100
          dead=("_PCM2","_PCM3","_PCF2","_PCF3")

          def clean_payload(line):
            payload=line.split(":",1)[1] if ":" in line else line
            # remove engine tokens and common argument payloads
            s=re.sub(r"\$S(?:bp|sp|vp|bs|bv)[^|]*\|(?:\d+\|)?"," ",payload)
            s=re.sub(r"\$W[ms][^|]*\|\d*"," ",s)
            s=re.sub(r"\$E[^|]*\|"," ",s)
            s=re.sub(r"\$b[^|]*\|"," ",s)
            s=re.sub(r"\$[A-Za-z][A-Za-z0-9]*\|?"," ",s)
            s=s.replace("\\n"," / ")
            return re.sub(r"\s+"," ",s).strip()

          # Global Korean token frequency gives a project-specific typo dictionary.
          global_freq=Counter()
          roots=[Path("Awakening/Messages (K)"),Path("Awakening/DLC Message (K)")]
          for root in roots:
            for p in root.rglob("*.txt"):
              try: txt=p.read_text(encoding="utf-8")
              except: continue
              for line in txt.splitlines():
                if not line.startswith("MID_"): continue
                mid=line.split(":",1)[0]
                if any(x in mid for x in dead): continue
                c=clean_payload(line)
                global_freq.update(re.findall(r"[가-힣]{2,12}",c))

          token_ctx=defaultdict(list)
          pattern_hits=[]
          outscope=[]

          patterns=[
            ("수 밖에",re.compile(r"수\s+밖에")),
            ("할 수록",re.compile(r"[가-힣]+\s+수록")),
            ("것 보다",re.compile(r"(?:것|거)\s+보다")),
            ("것 만큼",re.compile(r"(?:것|거|때)\s+만큼")),
            ("할 만",re.compile(r"[가-힣]+할만(?:한|하다|해|큼|도|은|이|하지)?")),
            ("때 붙임",re.compile(r"[가-힣]{2,}때(?:는|도|가|를|마다|부터|까지|라면|였|인)?")),
            ("어느정도",re.compile(r"어느정도")),
            ("웬/왠",re.compile(r"왠만|왠일|웬지")),
            ("며칠",re.compile(r"몇일")),
            ("금세",re.compile(r"금새")),
            ("어떡해",re.compile(r"어떻해")),
            ("돼/되어 있다",re.compile(r"(?:되어|돼|해|하고|하고서|걸려|놓여|붙어|숨어|남아|살아|앉아|들어)있")),
            ("안되",re.compile(r"안되(?:는|면|니까|죠|지|고|게|겠다|겠|나요|어|었|었습니다|다)")),
            ("못지 않",re.compile(r"못지\s+않")),
            ("뿐 붙임",re.compile(r"[가-힣]+뿐(?:이|은|만|이다|인데|이라|입니다)")),
            ("띄운 조사",re.compile(r"[가-힣]+\s+(?:은|는|이|가|을|를|도|만|부터|까지|처럼|보다|에게|한테|의)(?:\s|[,.!?…])")),
            ("문장부호 앞 공백",re.compile(r"[가-힣] +[,!?]")),
            ("기억상실",re.compile(r"기억상실")),
            ("인기만점",re.compile(r"인기만점")),
            ("어처구니 없는",re.compile(r"어처구니\s+없는")),
            ("시치미떼",re.compile(r"시치미떼")),
            ("단정짓",re.compile(r"단정짓")),
            ("마음 먹",re.compile(r"마음\s+먹")),
            ("입다물",re.compile(r"입다물")),
            ("가슴 속",re.compile(r"가슴\s+속")),
            ("오래 전에",re.compile(r"오래\s+전에")),
            ("한 단어 오타 후보",re.compile(r"(?:말슴|먹엇|맨일|틀키|그럴려|휴식입나까|죄르르|훔쳐다는|분분해|쟈[,!?])"))
          ]

          for pstr in selected:
            p=Path(pstr)
            txt=p.read_text(encoding="utf-8")
            for line in txt.splitlines():
              if not line.startswith("MID_"): continue
              mid=line.split(":",1)[0]
              if any(x in mid for x in dead): continue
              c=clean_payload(line)
              for tok in re.findall(r"[가-힣]{2,12}",c):
                if len(token_ctx[tok])<3:
                  token_ctx[tok].append((pstr,mid,c[:900]))
              for label,pat in patterns:
                if pat.search(c):
                  pattern_hits.append((label,pstr,mid,c[:1000]))
              # visible Japanese kana in ordinary support/DLC payload = likely untranslated residue.
              # Story event directives can contain Japanese text, so only record if no Korean at all or support-style file.
              kana=len(re.findall(r"[ぁ-んァ-ヶ]",c))
              kor=len(re.findall(r"[가-힣]",c))
              if kana>=8 and (kor<5 or not re.search(r"/(?:P00[12]|0\d\d|1\d\d|2[0-6])\.txt$",pstr)):
                outscope.append(("VISIBLE_JAPANESE",pstr,mid,c[:1200]))

          # Rare token one-syllable substitution candidates.
          rare=[]
          common_by_len=defaultdict(list)
          for w,f in global_freq.items():
            if f>=12 and 2<=len(w)<=10:
              common_by_len[len(w)].append((w,f))

          def one_sub(a,b):
            return len(a)==len(b) and sum(x!=y for x,y in zip(a,b))==1

          for tok,ctxs in token_ctx.items():
            f=global_freq[tok]
            if f>3 or len(tok)<2 or len(tok)>10: continue
            near=[]
            for w,wf in common_by_len[len(tok)]:
              if one_sub(tok,w):
                near.append((wf,w))
            if near:
              near=sorted(near,reverse=True)[:8]
              rare.append((f,tok,near,ctxs))

          rare.sort(key=lambda x:(x[0],-x[2][0][0],x[1]))
          print("=== SELECTED ===")
          for i,p in enumerate(selected,1): print(f"SEL\t{i:03d}\t{p}")
          print("=== PATTERNS ===")
          for hit in pattern_hits:
            print("PAT\t"+"\t".join(hit))
          print("=== RARE_ONE_SUB ===")
          for f,tok,near,ctxs in rare[:450]:
            print("RARE\t"+tok+"\tfreq="+str(f)+"\tnear="+",".join(f"{w}:{wf}" for wf,w in near))
            for p,mid,c in ctxs: print("CTX\t"+p+"\t"+mid+"\t"+c)
          print("=== OUTSCOPE ===")
          for hit in outscope[:250]: print("OUT\t"+"\t".join(hit))
          PY

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/scan-awakening-orthography-batch2.yml
          git commit -m "Remove temporary Awakening batch 2 scan"
          git push origin HEAD:main
