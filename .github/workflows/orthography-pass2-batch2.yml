name: Awakening orthography pass 2 batch 2
on:
  push:
    paths: ['.github/workflows/orthography-pass2-batch2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum python3-pil >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import ImageFont
          roots=[Path('Awakening/Messages (K)'),Path('Awakening/DLC Message (K)')]
          dead=('PCM2','PCM3','PCF2','PCF3')
          mid_re=re.compile(r'^(MID_[^:]+): (.*?)(?=^MID_|\Z)',re.M|re.S)
          before={}
          changed_files=[]
          changed_mids=[]
          replacements=[]
          def patch_body(body):
              old=body
              # clear orthographic/spacing errors only; honorific spacing intentionally out of scope
              body=body.replace('까봐','까 봐')
              body=body.replace(' 커녕','커녕')
              body=body.replace('받을만한','받을 만한')
              body=body.replace('상처 받는','상처받는')
              return body
          for root in roots:
            for p in sorted(root.glob('*.txt')):
              try: s=p.read_text('utf-8')
              except UnicodeDecodeError: continue
              orig=s
              before[p]=orig
              out=[]; pos=0; anychg=False
              for m in mid_re.finditer(orig):
                out.append(orig[pos:m.start()])
                mid,body=m.group(1),m.group(2)
                nb=body if any(x in mid for x in dead) else patch_body(body)
                if nb!=body:
                  anychg=True; changed_mids.append((p,mid,body,nb))
                  for a,b in [('까봐','까 봐'),(' 커녕','커녕'),('받을만한','받을 만한'),('상처 받는','상처받는')]:
                    d=body.count(a)-nb.count(a)
                    if d>0: replacements.append((str(p),mid,a,b,d))
                out.append(f'{mid}: '+nb); pos=m.end()
              out.append(orig[pos:])
              if anychg:
                ns=''.join(out); p.write_text(ns,encoding='utf-8',newline=''); changed_files.append(p)
          assert changed_files, 'no files changed'
          # integrity checks: exact MID order/count, control sequence, literal visual line breaks, strict UTF-8/C0
          ctrl=re.compile(r'\$[A-Za-z][^$\\\n\r가-힣!?…。、！？ ]*\|?')
          mid_id=re.compile(r'^MID_[^:]+:',re.M)
          for p in changed_files:
            ns=p.read_bytes().decode('utf-8')
            assert '\ufffd' not in ns
            assert not any(ord(c)<32 and c not in '\n\r\t' for c in ns)
            assert mid_id.findall(before[p])==mid_id.findall(ns),(p,'MID order/count')
            assert before[p].count('\\n')==ns.count('\\n'),(p,'literal line breaks')
            assert ctrl.findall(before[p])==ctrl.findall(ns),(p,'controls')
          # modified visual-line width check, style-specific. Non-$t0/$t1 files are structurally checked but have no applicable threshold.
          font=ImageFont.truetype('/usr/share/fonts/truetype/nanum/NanumGothic.ttf',14)
          limits={'$t0':278.8125,'$t1':298.734375}
          checked=0
          def clean(seg):
            seg=re.sub(r'\$[A-Za-z][^$\\]*?\|','',seg)
            seg=re.sub(r'\$[A-Za-z][A-Za-z0-9_]*','',seg)
            return seg
          for p,mid,oldbody,newbody in changed_mids:
            style='$t0' if newbody.startswith('$t0') else ('$t1' if newbody.startswith('$t1') else None)
            if not style: continue
            # find changed visual segments by index and check all new segments that differ
            oldsegs=[]; newsegs=[]
            for page in re.split(r'\$[pk]',oldbody): oldsegs += page.split('\\n')
            for page in re.split(r'\$[pk]',newbody): newsegs += page.split('\\n')
            for i,seg in enumerate(newsegs):
              if i<len(oldsegs) and seg==oldsegs[i]: continue
              txt=clean(seg); w=font.getlength(txt); checked+=1
              assert w<=limits[style],(p,mid,style,w,txt)
          print('CHANGED_FILES',len(changed_files))
          print('CHANGED_MIDS',len(changed_mids))
          print('WIDTH_CHECKED_LINES',checked)
          for r in replacements: print('FIX',*r,sep='\t')
          print('PASS UTF8/C0/MID/control/linebreak/width')
          PY
          git diff --check
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/orthography-pass2-batch2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix more Awakening Korean spacing'
          git push
