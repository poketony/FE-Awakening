name: Fix Awakening compound spacing
on:
  push:
    paths: ['.github/workflows/fix-awakening-compound-spacing.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum python3-pil >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import ImageFont

          roots=[Path('Awakening/Messages (K)'), Path('Awakening/DLC Message (K)')]
          dead=('PCM2','PCM3','PCF2','PCF3')
          mid_re=re.compile(r'^(MID_[^:]+): (.*?)(?=^MID_|\Z)', re.M|re.S)
          ctrl_re=re.compile(r'\$[A-Za-z][^$\\\n\r가-힣!?…。、！？ ]*\|?')
          mid_id=re.compile(r'^MID_[^:]+:', re.M)

          before={}
          changed=[]
          changed_files=[]

          def patch_body(body):
              # Confirmed compound/passive verb spacing family requested by user.
              return body.replace('조종 당', '조종당')

          for root in roots:
              for p in sorted(root.glob('*.txt')):
                  s=p.read_text('utf-8')
                  before[p]=s
                  ms=list(mid_re.finditer(s))
                  if not ms:
                      # Non-MID text resources: only exact requested phrase family.
                      ns=patch_body(s)
                      if ns!=s:
                          p.write_text(ns, encoding='utf-8', newline='')
                          changed_files.append(p)
                      continue
                  out=[]; pos=0; anychg=False
                  for m in ms:
                      out.append(s[pos:m.start()])
                      mid,body=m.group(1),m.group(2)
                      nb=body if any(x in mid for x in dead) else patch_body(body)
                      if nb!=body:
                          anychg=True
                          changed.append((p,mid,body,nb))
                      out.append(f'{mid}: '+nb)
                      pos=m.end()
                  out.append(s[pos:])
                  if anychg:
                      p.write_text(''.join(out), encoding='utf-8', newline='')
                      changed_files.append(p)

          assert changed_files, 'no matching live Awakening text found'

          # File integrity checks.
          for p in changed_files:
              ns=p.read_bytes().decode('utf-8')
              assert '\ufffd' not in ns
              assert not any(ord(c)<32 and c not in '\n\r\t' for c in ns)
              old=before[p]
              if mid_id.search(old):
                  assert mid_id.findall(old)==mid_id.findall(ns), (p,'MID order/count')
                  assert ctrl_re.findall(old)==ctrl_re.findall(ns), (p,'controls')
                  assert old.count('\\n')==ns.count('\\n'), (p,'literal linebreaks')

          # Modified-line width checks for t0/t1 dialogue.
          font=ImageFont.truetype('/usr/share/fonts/truetype/nanum/NanumGothic.ttf',14)
          limits={'$t0':278.8125,'$t1':298.734375}
          checked=0
          def clean(seg):
              seg=re.sub(r'\$[A-Za-z][^$\\]*?\|','',seg)
              seg=re.sub(r'\$[A-Za-z][A-Za-z0-9_]*','',seg)
              return seg
          for p,mid,oldbody,newbody in changed:
              style='$t0' if newbody.startswith('$t0') else ('$t1' if newbody.startswith('$t1') else None)
              if not style: continue
              oldsegs=[]; newsegs=[]
              for page in re.split(r'\$[pk]',oldbody): oldsegs += page.split('\\n')
              for page in re.split(r'\$[pk]',newbody): newsegs += page.split('\\n')
              for i,seg in enumerate(newsegs):
                  if i<len(oldsegs) and seg==oldsegs[i]: continue
                  txt=clean(seg); w=font.getlength(txt); checked+=1
                  assert w<=limits[style], (p,mid,style,w,txt)

          print('CHANGED_FILES',len(changed_files))
          print('CHANGED_MIDS',len(changed))
          print('WIDTH_CHECKED_LINES',checked)
          print('PASS UTF8/C0/MID/control/linebreak/width')
          PY
          git diff --check
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-awakening-compound-spacing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix Awakening compound verb spacing'
          git push
