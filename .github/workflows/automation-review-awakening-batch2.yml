name: Review Awakening fresh batch 2
on:
  push:
    paths:
      - '.github/workflows/automation-review-awakening-batch2.yml'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install font tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install --quiet pillow
      - name: Apply exact reviewed fixes and validate
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import ImageFont
          import re, subprocess
          p=Path('Awakening/Messages (K)/クロム_ソワレ.txt')
          old=p.read_text(encoding='utf-8')
          rules=[
            ('MID_支援_クロム_ソワレ_Ｂ','| 수아레, 안녕.','|수아레, 안녕.'),
            ('MID_支援_クロム_ソワレ_Ｂ','꽤 많이 쌓여있는데','꽤 많이 쌓여 있는데'),
            ('MID_支援_クロム_ソワレ_Ａ','나도 튕겨 나갈 뻔 했어.','나도 튕겨 나갈 뻔했어.'),
            ('MID_支援_クロム_ソワレ_Ｓ','여성으로서 보고 있는게 아니야.','여성으로서 보고 있는 게 아니야.'),
            ('MID_支援_クロム_ソワレ_Ｓ','요래도, 바느질도, 빨래도 서투르고…','요리도, 바느질도, 빨래도 서투르고…'),
          ]
          lines=old.splitlines(keepends=True); counts=[]; touched=[]
          out=[]
          for i,line in enumerate(lines):
            nl=line
            if line.startswith('MID_'):
              mid=line.split(':',1)[0]
              for target,a,b in rules:
                if mid==target:
                  n=nl.count(a); counts.append((target,a,n))
                  if n: nl=nl.replace(a,b); touched.append((i,target,a,b))
            out.append(nl)
          if len(counts)!=len(rules) or any(n!=1 for _,_,n in counts):
            raise SystemExit(f'exact replacement count failure: {counts}')
          new=''.join(out)
          p.write_text(new,encoding='utf-8',newline='')
          if '\ufffd' in new: raise SystemExit('U+FFFD')
          if any(ord(c)<32 and c not in '\n\r\t' for c in new): raise SystemExit('invalid C0')
          om=[x.split(':',1)[0] for x in old.splitlines() if x.startswith('MID_')]
          nm=[x.split(':',1)[0] for x in new.splitlines() if x.startswith('MID_')]
          if om!=nm: raise SystemExit('MID order/count changed')
          cre=re.compile(r'\$[A-Za-z][A-Za-z0-9]*')
          if cre.findall(old)!=cre.findall(new): raise SystemExit('control code sequence changed')
          if old.count('\\n')!=new.count('\\n'): raise SystemExit('literal newline structure changed')
          for dead in ('PCM2','PCM3','PCF2','PCF3'):
            oldd=[x for x in old.splitlines() if dead in x]
            newd=[x for x in new.splitlines() if dead in x]
            if oldd!=newd: raise SystemExit(f'dead branch touched: {dead}')
          # ensure the only textual changes are the five exact substitutions
          expected=old
          for _,a,b in rules: expected=expected.replace(a,b,1)
          if expected!=new: raise SystemExit('unexpected diff')
          font=ImageFont.truetype('/usr/share/fonts/truetype/nanum/NanumGothic.ttf',14)
          lim=298.734375
          changed_text=['수아레, 안녕.','꽤 많이 쌓여 있는데','나도 튕겨 나갈 뻔했어.','여성으로서 보고 있는 게 아니야.','요리도, 바느질도, 빨래도 서투르고…']
          for s in changed_text:
            w=font.getlength(s); print(f'WIDTH {w:.3f}/{lim:.3f} {s}')
            if w>lim: raise SystemExit(f'width exceeded: {s}')
          track=Path('Awakening/AUTOMATION_REVIEWED_FILES.txt')
          t=track.read_text(encoding='utf-8')
          entry='Awakening/Messages (K)/クロム_ソワレ.txt\n'
          if entry not in t: track.write_text(t+entry,encoding='utf-8',newline='')
          subprocess.run(['git','diff','--check'],check=True)
          print('VALIDATION_OK')
          PY
      - name: Commit reviewed batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-review-awakening-batch2.yml
          git add 'Awakening/Messages (K)/クロム_ソワレ.txt' Awakening/AUTOMATION_REVIEWED_FILES.txt
          git diff --cached --check
          git commit -m 'Review fresh Awakening dialogue batch 2'
          git push origin HEAD:main
          echo FINAL_SHA=$(git rev-parse HEAD)
