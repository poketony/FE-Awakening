name: Audit Awakening control codes
on:
  push:
    paths: ['.github/workflows/audit-awakening-control-codes.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Japanese and Korean control codes
        run: |
          python3 - <<'PY' > control-audit.txt
          from pathlib import Path
          import re, collections

          pairs=[(Path('Awakening/Messages (J)'),Path('Awakening/Messages (K)')),
                 (Path('Awakening/DLC Message (J)'),Path('Awakening/DLC Message (K)'))]
          midre=re.compile(r'^(MID_[^:]+): (.*)$',re.M)
          dead=re.compile(r'_(?:PCM[23]|PCF[23])(?:$|_)')
          code_re=re.compile(r'\$([A-Za-z]+)(\d*)')

          def mids(text):
            ms=list(midre.finditer(text)); d={}
            for idx,m in enumerate(ms):
              start=m.start(2); end=ms[idx+1].start() if idx+1<len(ms) else len(text)
              d[m.group(1)]=text[start:end].rstrip('\r\n')
            return d

          def families(s):
            return [(m.group(1),m.group(2)) for m in code_re.finditer(s)]

          def payloads(s, fam):
            if fam in ('Wm','Ws','E','Svp','b'):
              pat=re.compile(r'\$'+fam+r'([^|$\\\r\n]*)\|')
              return pat.findall(s)
            if fam=='t': return re.findall(r'\$t(\d+)',s)
            if fam=='w': return re.findall(r'\$w(\d+)\|?',s)
            if fam=='Sbs': return re.findall(r'\$Sbs(\d+)\|?',s)
            return []

          rows=[]; missing_mid=[]; missing_files=[]; checked=0; kr_codes=[]
          for jroot,kroot in pairs:
            for kp in sorted(kroot.glob('*.txt')):
              jp=jroot/kp.name
              if not jp.exists():
                missing_files.append(str(kp)); continue
              km=mids(kp.read_text(encoding='utf-8')); jm=mids(jp.read_text(encoding='utf-8'))
              for name,kbody in km.items():
                if dead.search(name): continue
                if ('PCM' in name or 'PCF' in name) and not ('PCM1' in name or 'PCF1' in name): continue
                if name not in jm:
                  missing_mid.append((str(kp),name)); continue
                jbody=jm[name]; checked+=1
                if re.search(r'\$KrP?\d*\|?',kbody): kr_codes.append((str(kp),name,kbody[:250]))
                jf=families(jbody); kf=families(kbody)
                jcore=[x for x in jf if x[0] not in {'Nu','Np'}]
                kcore=[x for x in kf if x[0] not in {'Nu','Np'}]
                diffs=[]
                if jcore!=kcore:
                  diffs.append(('STRUCT',jcore,kcore))
                for fam in ('Wm','Ws','E','Svp','b','t'):
                  a=payloads(jbody,fam); b=payloads(kbody,fam)
                  if a!=b: diffs.append((fam,a,b))
                if diffs:
                  rows.append((str(kp),name,diffs,jbody,kbody))

          print('CHECKED_MIDS',checked)
          print('CANDIDATE_MIDS',len(rows))
          print('KR_CODES',len(kr_codes))
          print('MISSING_JP_MIDS',len(missing_mid))
          print('MISSING_JP_FILES',len(missing_files))
          by=collections.Counter(d[0] for _,_,ds,_,_ in rows for d in ds)
          print('DIFF_COUNTS',dict(by))
          for i,(p,n,ds,j,k) in enumerate(rows,1):
            print(f'@@CANDIDATE {i}@@')
            print('FILE',p); print('MID',n)
            for typ,a,b in ds:
              print(typ,'JP=',a,'KR=',b)
            print('JP_TEXT',j.replace('\n',' ')[:700])
            print('KR_TEXT',k.replace('\n',' ')[:700])
          print('=== KR CODES ===')
          for x in kr_codes: print(x)
          print('=== MISSING JP MIDS ===')
          for x in missing_mid[:200]: print(x)
          print('=== MISSING JP FILES ===')
          for x in missing_files: print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: control-audit
          path: control-audit.txt